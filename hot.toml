# Profile-guided packing of paged code and rodata
# (docs/plan/02-architecture.md §3.5). Read by `cargo xtask pagelink`.
#
# Each cluster is an ordered list of patterns (globs over demangled symbol
# names, or over section names); the matching paged sections are packed
# first, adjacent, in pattern order, each cluster starting on a 1 KiB line
# boundary. A cluster that fits the cache (24 lines or less, leaving 8 for
# everything else) runs fault-free after warm-up. Everything not in a
# cluster follows, grouped by crate in link order. `bins` limits a cluster
# to some binaries (all when absent). The fault profiler (WP-T-8,
# `xtask dev prof --update-hot`) will regenerate the firmware clusters.
#
# [[cluster]]
# name = "mp3-frame"
# symbols = ["orpheus_codec_mp3::frame::*", "orpheus_codec_mp3::imdct::*"]

# The gapless join (AU-5): the code that runs between a track's decoder
# ending and the next one's first block (hand-over, decoder open with its
# head parsing, the DSP format check, the clock floor), packed together
# with the preparation that runs shortly before it (probe, tag skip,
# inspect): the preparation warms the lines the open needs, and the join
# touches few lines, so it evicts little of the decoding hot set. Measured
# on the player as `join#N: loads=` (`status`).
[[cluster]]
name = "gapless-join"
bins = ["firmware"]
symbols = [
    "firmware::audio::Ring>::hand_over",
    "firmware::audio::handed_over",
    "firmware::audio::prepare::*",
    "firmware::audio::inspect_head",
    "orpheus_codecs::inspect",
    "*orpheus_audio::probe::*",
    "orpheus_codec_mp3::parse_head",
    "orpheus_codec_mp3::parse_vbr_tag",
    "orpheus_codec_flac::parse_head",
    "orpheus_codec_flac::FlacDecoder>::metadata",
    "orpheus_audio::arena::Arena>::*",
    "orpheus_codecs::open",
    "orpheus_codecs::open_mp3",
    "orpheus_codecs::open_flac",
    "orpheus_codecs::open_wav",
    "orpheus_codec_mp3::Mp3Decoder>::open",
    "orpheus_codec_flac::FlacDecoder>::open",
    "orpheus_codec_wav::WavDecoder>::open",
    "orpheus_dsp::chain::Chain<*>::set_format",
    "firmware::audio::codec_name",
    "firmware::audio::sound_active",
    "firmware::audio::dsp_clock_floor",
    "atj2157_hal::clock::set_level",
    "orpheus_player::Player>::gapless_next",
    "orpheus_audio::ring::StreamRing>::*",
    "orpheus_audio::source::WindowSource>::*",
]

# Opus (AU-8). Measured per 20 ms frame (opusbench in an emulator, mapped
# onto the firmware layout and replayed through the pager simulator; see
# STATUS 2026-11-24 AU-8 Opus speed): CELT touches ~33 code lines and ~13
# rodata lines, SILK ~27 code lines. Three clusters in this order so that
# a CELT stream uses `opus-celt` + `opus-frame` (contiguous) and a SILK
# stream `opus-frame` + `opus-silk` (contiguous), each within the 32
# physical lines as far as it goes. The CELT rodata (twiddles, bit reversal,
# window, allocation and energy tables, 15.5 KB) fills rodata group 0, the
# whole 16-line rodata cache; the SILK tables follow in group 1.
[[cluster]]
name = "opus-celt"
bins = ["firmware"]
symbols = [
    "orpheus_codec_opus::celt::decoder::decode",
    "orpheus_codec_opus::celt::decoder::unquant_*",
    "orpheus_codec_opus::celt::rate::*",
    "orpheus_codec_opus::celt::bands::quant_*",
    "orpheus_codec_opus::celt::bands::compute_theta",
    "orpheus_codec_opus::celt::bands::haar1",
    "orpheus_codec_opus::celt::bands::stereo_merge",
    "orpheus_codec_opus::celt::bands::*interleave_hadamard",
    "orpheus_codec_opus::celt::bands::bitexact_*",
    "orpheus_codec_opus::celt::vq::alg_unquant",
    "orpheus_codec_opus::celt::vq::decode_pulses",
    "orpheus_codec_opus::celt::vq::ncwrs_urow",
    "orpheus_codec_opus::celt::vq::cwrsi_row",
    "orpheus_codec_opus::celt::vq::unext",
    "orpheus_codec_opus::celt::vq::uprev",
    "orpheus_codec_opus::celt::vq::exp_rotation*",
    "orpheus_codec_opus::celt::vq::extract_collapse_mask",
    "orpheus_codec_opus::celt::vq::renormalise_vector",
    "orpheus_codec_opus::celt::math::sqrt",
    "orpheus_codec_opus::celt::math::ldexp",
    "orpheus_codec_opus::celt::math::exp2",
