# What every Opus frame runs, CELT or SILK: the packet loop, the Ogg packet
# reader, the range decoder, the float to i16 output.
[[cluster]]
name = "opus-frame"
bins = ["firmware"]
symbols = [
    "<orpheus_codec_opus::ogg_opus::OpusDecoder as orpheus_audio::decoder::Decoder>::decode",
    "orpheus_codec_opus::ogg_opus::OpusDecoder>::emit",
    "orpheus_codec_opus::packet::*",
    "orpheus_codec_opus::entdec::*",
    "orpheus_ogg::assembled::PacketReader>::next_packet",
    "orpheus_ogg::crc_update",
    "orpheus_ogg::crc_view",
    "orpheus_audio::source::View>::*",
    # The range check of `copy_within` (not inlined; called per band):
    # elsewhere it shared a physical line with `quant_band` and the two
    # evicted each other ~50 times in a frame with short blocks.
    "core::slice::index::range::<core::ops::range::Range<usize>>",
    "<orpheus_codec_opus::opus_dec::OpusDec>::output",
    "<orpheus_codec_opus::opus_dec::OpusDec>::float_to_i16",
    "orpheus_codec_opus::pcm::soft_clip",
]

[[cluster]]
name = "opus-silk"
bins = ["firmware"]
symbols = [
    # Transient CELT frames only: kept out of `opus-celt` so that it and
    # `opus-frame` fit the 32 physical lines together.
    "orpheus_codec_opus::celt::bands::anti_collapse",
    "<orpheus_codec_opus::opus_dec::OpusDec>::silk_part",
    "<orpheus_codec_opus::opus_dec::OpusDec>::silk_run",
    "orpheus_codec_opus::silk::decode_indices::*",
    "orpheus_codec_opus::silk::decode_pulses::*",
    "orpheus_codec_opus::silk::decode_*",
    "orpheus_codec_opus::silk::nlsf::*",
    "orpheus_codec_opus::silk::lpc::*",
    "orpheus_codec_opus::silk::macros::*",
    "orpheus_codec_opus::silk::stereo::*",
    "orpheus_codec_opus::silk::resampler::*",
    "orpheus_codec_opus::silk::plc::*",
    "orpheus_codec_opus::silk::cng::*",
    "<orpheus_codec_opus::opus_dec::OpusDec>::mix_extras",
    "<orpheus_codec_opus::opus_dec::OpusDec>::decode_long",
