# A synth source's block loop (SYN-3, `audio::synth::play_midi`): every
# render block resumes it (requests, the render call, the governor, the
# DSP and PCM ring, the chores' checks). Placed in the code window's hole
# before `flac-frame` (which starts over `mp3-frame`'s physical lines):
# 7 lines that cost no page. While a synth source plays no codec does, so
# sharing physical lines with `mp3-frame`'s neighbours costs nothing; it
# shares 6 with `play-fill` (the MIDI file is read a block every few
# seconds while it plays: no conflict worth a page).
[[cluster]]
name = "synth-block"
bins = ["firmware"]
fits_with = ["synth-render", "synth-midi"]
symbols = [
    "firmware::audio::Apart<firmware::audio::synth::play_midi::*>::poll",
]

# The FLAC decoder per frame (see above: on `mp3-frame`'s physical lines;
# after `games-io` and `dir-walk`, the code window is left empty up to
# there, `starts_over`).
[[cluster]]
name = "flac-frame"
bins = ["firmware"]
fits_with = ["play-block", "play-fill"]
starts_over = "mp3-frame"
symbols = [
    "<orpheus_codec_flac::FlacDecoder as orpheus_audio::decoder::Decoder>::decode",
    "orpheus_codec_flac::FlacDecoder>::sync",
    "orpheus_codec_flac::frame::*",
]

# The synthesiser's per-sample code (SYN-3): the render with the voices,
# oscillators, FM, filter, mix, reverb, chorus and limiter inlined
# (`Engine::render_i16`, 12 KB), the filter and envelope steps, and the
# drum kinds a General MIDI kit sounds most (kick, snare, hats, clap).
# After `flac-frame` it sits on physical lines 17–31 and 0, clear of
# `synth-block` (1–7); 16 lines, so the two and the PCM path fit the
# cache together. Outside (per control period or rarer, a line each when
# they run): the other drum kinds, the filter design, `exp2`, pan gains.
# Hand-ordered from `cargo xtask hot --name synth-render` (the generated
# order put rarely used drums first). `budget_lines`: the cluster's 16
# lines + the 10 reachable functions outside it (`xtask stack --check`).
[[cluster]]
name = "synth-render"
bins = ["firmware"]
fits_with = ["synth-block", "synth-midi"]
from = [
    "*orpheus_synth::engine::Engine>::render_i16",
]
stop = [
    "*orpheus_synth::engine::Engine>::apply",
]
budget_lines = 26
symbols = [
    "<orpheus_synth::engine::Engine>::render_i16",
    "<orpheus_synth::filter::Svf>::process",
    "<orpheus_synth::env::Env>::advance",
    "<orpheus_synth::drum::DrumVoice>::kick",
    "<orpheus_synth::drum::DrumVoice>::snare",
    "<orpheus_synth::drum::DrumVoice>::hat",
    "<orpheus_synth::drum::DrumVoice>::clap",
]

# The synth source's cold code (SYN-3 load governor, 2026-11-26): the
# open, scan and seek steps, the player's and engine's init, a program
# change's patch install. Placed after `synth-render` (which ends in
# physical line 0) to fill lines 1–7 of the window before `synth-midi`,
# which must start on line 8: what would otherwise be padding.
[[cluster]]
name = "synth-cold"
bins = ["firmware"]
symbols = [
    "<orpheus_midi::player::MidiPlayer>::step",
    "<orpheus_midi::player::MidiPlayer>::init",
    "<orpheus_synth::engine::Engine>::init",
    "<orpheus_synth::engine::Engine>::set_patch",
]

# A synth source's other per-piece code (SYN-3 load governor,
# 2026-11-26): the governor's plan and measurement with the engine's
# estimate inlined (`plan_piece`, `after_piece`), the pace rule's rest,
# the MIDI player's next event (`timed`) and the sequencer's channel
# messages. On physical lines 8–15, clear of `synth-block` (1–7) and
# `synth-render` (17–31, 0): before, `timed` sat on line 20 inside the
# render's lines and `handle` on 23, two line loads (≈ 180 µs each) a
# piece or more. Not in it: `Engine::apply` (a note's start, 2.8 KB: no
# room) and the PCM path (`play-block`'s, shared with the codecs).
[[cluster]]
name = "synth-midi"
bins = ["firmware"]
fits_with = ["synth-block", "synth-render"]
starts_over = "flac-frame"
symbols = [
    "firmware::audio::synth::plan_piece",
    "firmware::audio::synth::after_piece",
    "firmware::audio::Apart<firmware::audio::synth::pace_rest::*>::poll",
    "<orpheus_midi::player::MidiPlayer>::timed",
    "<orpheus_midi::seq::Sequencer>::handle",
    "<orpheus_midi::player::MidiPlayer>::render_any::<i16>::{closure#0}",
    "<orpheus_midi::player::MidiPlayer>::set_fx_enabled",
    "<orpheus_synth::fx::Reverb>::is_idle",
    "<orpheus_synth::engine::Engine>::active_voices",
    "*orpheus_synth::load::Estimate>::fx_of*",
]

# The paged toy: three functions spread over the generated code, packed
# together (checked by `cargo xtask test pagelink`).
[[cluster]]
name = "pagetoy-hot"
bins = ["bringup-pagetoy"]
symbols = ["bringup_pagetoy::generated::work_40", "bringup_pagetoy::generated::work_3", "bringup_pagetoy::generated::work_9"]
