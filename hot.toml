symbols = [
    "orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::next_set::*",
    "orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::walk::*",
    "orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::walk_step::*",
