# A synth source's outer loop (SYN-3, `audio::synth::play_midi`): the
# open, requests, pause and seek, the position, chores and logs, once
# every 4,096 frames (93 ms) or when something waits for it. On physical
# lines 18–23: a wake-up runs its first line (18, no other per-piece
# code's) and the one that resumes `pieces` (play-pcm's lines).
#
# In front of it, on line 18 with the poll's entry, the key scan's 10 ms
# tick in thread mode (the input task's poll, the ticker's, the time
# driver's `now`: 808 B, 100 times a second): before (SYN-3, 2026-11-26)
# they were on lines 31, 0 and 3 (`render_i16`) and 20, so every thread
# mode slot between the synth's pieces (a rest, a wait for the ring:
# ≈ 40 a second with a tick in them) evicted three render lines, ≈ 2 %
# of real time of the render's paging (`pg=`) that the cache model
# missed. On line 18 they share a code line with the wake-up's entry; an
# MP3 stream pays one line (`mp3-frame`'s 18) where it paid four.
#
# After the tick, on the same line, the main executor's loop
# (`atj2157_hal::executor::main_loop`): every slot of thread mode runs it
# (a rest, a wait for the ring), and inside `MainExecutor::run` it was on
# lines 9–10 (`render_i16`'s last, `synth-inner`'s first): two line loads
