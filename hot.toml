    "orpheus_codec_opus::celt::math::frac_mul16",
    "orpheus_codec_opus::celt::bands::denormalise_bands",
    "orpheus_codec_opus::celt::decoder::synthesis",
    "orpheus_codec_opus::celt::mdct::*",
    "orpheus_codec_opus::celt::decoder::comb_filter",
    "orpheus_codec_opus::celt::decoder::deemphasis",
    # rodata: the 20 ms long-block and the short-block MDCT sizes first.
    "orpheus_codec_opus::celt::tables::MDCT_TRIG_1920",
    "orpheus_codec_opus::celt::tables::FFT_TWIDDLES",
