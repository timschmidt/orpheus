# Playback, every block (AU-PERF, 2026-11-25). Measured before on the
# player (T-8 profiler, MP3 48 kHz + Pictures browsing, soak
# `mixed-ring-seed1-7` "browse pictures"): ~3,000 line loads/s, 0 % idle;
# the old `play-block` cluster was 77 lines (the audio task's and
# `play_file`'s 37 KB and 12 KB state machines, `AnyDecoder::decode` with
# every codec's frame code inlined), and the per-block lines evicted each
# other: the code cache is direct-mapped (a line's place is VA bits 10-14,
# 02 §3.1), so hot lines 32 KiB apart share one physical line.
#
# Now the block path is small named functions (fw/firmware/src/audio.rs
# "the block path") and each codec's `decode` is a function of its own.
# Four clusters in this order, consecutive (after `steps-sample`):
# `mp3-frame` + `play-pcm` + `play-block` + `play-fill` fit the 32
# physical lines together (no two of their lines share one: 11 + 5 + 10 +
# 6 as built; `play-pcm`, the part a synth source shares, split off
# `play-block` in SYN-3, 2026-11-26, with the per-block writer and note
# that were in no cluster). `flac-frame` starts on `mp3-frame`'s
# physical lines (only one decoder runs; `starts_over`, the code window
# left empty before it), clear of the other three while it is no longer
# than 32 - (play-pcm + play-block + play-fill) lines. Between them the chores' clusters that run with
# `play-fill` while music plays (`games-io`, `dir-walk`; AU-PERF games
# pieces, 2026-11-25). `fits_with` makes `pagelink` warn when an edit
# breaks that (`cargo xtask build` prints the warning and each cluster's
# lines).

# Step counting (SENS-1): the code that runs 25 times a second while steps
# are counted, also during playback: the sensor task's poll, the sample
# (one I2C burst read into the batch and the trace ring). Packed so that
# it takes one or two lines of the cache instead of touching scattered
# lines of the task, the BSP and the HAL; the detector and the day history
# run once a second (`firmware::sensor::batch`, not here). Placed right
# before `mp3-frame` (AU-PERF): its lines then share physical lines with
# the end of `play-fill` (32 lines on), the playback code that runs least
# often, instead of with the per-block code.
[[cluster]]
name = "steps-sample"
bins = ["firmware"]
symbols = [
    "embassy_executor::raw::TaskStorage<firmware::sensor::__sensor_task::*>::poll",
    "firmware::sensor::__sensor_task::__sensor_task_inner_function::{closure#0}",
    "firmware::sensor::sample",
    "firmware::sensor::trace_push",
    "yoton_bsp::accel::Accel>::read",
    "yoton_bsp::accel::Accel>::regs",
    "atj2157_hal::i2c_soft::SoftI2c>::*",
]

# The MP3 decoder per frame: the frame code (paged, resident.toml), the
# sync search and header parse, the stream reads (through `dyn
# ByteSource`).
[[cluster]]
name = "mp3-frame"
bins = ["firmware"]
fits_with = ["play-pcm", "play-block", "play-fill"]
symbols = [
    "<orpheus_codec_mp3::Mp3Decoder as orpheus_audio::decoder::Decoder>::decode",
    "orpheus_codec_mp3::Mp3Decoder>::find",
    "orpheus_audio::probe::MpegHeader>::parse",
    "orpheus_audio::probe::MpegHeader>::frame_len",
    "<orpheus_audio::ring::StreamRing as orpheus_audio::source::ByteSource>::*",
    "<firmware::audio::Ring as orpheus_audio::source::ByteSource>::*",
]

# The playback path a synth source shares with the codecs (SYN-3,
# 2026-11-26): what every wake-up of the audio task runs (the task's poll,
# `run_player`'s poll, the waits for room at a half) and every block's PCM
# path (the writer `Feeder::run` with the frames into the ring, the half's
# looks, the underrun ledger's note). First of the playback clusters, on
# physical lines 19–23 after `mp3-frame`: `synth-render` and `synth-inner`
# (below) take the 27 others, so the synth's whole per-piece code fits the
# cache. `Feeder::run` and `note_as` were in no cluster (each a line
# shared with `mp3-frame`'s, two loads every MP3 block).
[[cluster]]
name = "play-pcm"
bins = ["firmware"]
symbols = [
    # Every wake-up: the task's poll, `run_player`'s (lines 19–20 run).
    "embassy_executor::raw::TaskStorage<firmware::audio::__audio_task::*>::poll",
    "firmware::audio::Apart<firmware::audio::run_player::*>::poll",
    # At a half boundary.
    "firmware::audio::Room as *>::poll",
    "embassy_sync::waitqueue::atomic_waker::AtomicWaker>::register",
    "firmware::audio::PcmOut>::after_half",
    "firmware::audio::PcmOut>::headroom",
    "firmware::audio::PcmOut>::reading",
    "firmware::audio::PcmOut>::account",
    # Every block.
    "firmware::audio::begin_block",
    "orpheus_audio::pcm::Feeder>::run::*",
    "firmware::audio::PcmOut>::look",
    "firmware::audio::PcmOut>::wrote_half",
    "orpheus_audio::pcm::Book>::*",
    "firmware::audio::note_as",
    "firmware::audio::note",
    # The position and the chores' decision: every codec block, every
    # synth outer loop.
    "firmware::media::Server>::position",
    "orpheus_player::Player>::position",
    "firmware::media::Flow>::merge",
    "firmware::media::player_update::<firmware::audio::*",
    "orpheus_audio::chore::decide",
]

# Every codec block (the rest of the block path; `play-pcm` above): the
# task's wake-up through the player's futures (each a small poll function
# of its own, `Apart`), the block (`play_block`: decode, DSP and PCM ring,
# the looks at the DMA, the position, the refill and chores checks). The
# dispatcher `AnyDecoder::decode` is inlined into `decode_timed`. The
# largest state machine (`play_file`), of which only the resumption runs
# per wake-up, comes last.
[[cluster]]
name = "play-block"
bins = ["firmware"]
symbols = [
    "firmware::audio::Apart<firmware::audio::player_request::*>::poll",
    "firmware::audio::Apart<firmware::audio::play_block::*>::poll",
    "firmware::audio::decode_timed",
    "orpheus_codecs::AnyDecoder>::decode",
    "firmware::audio::after_block",
    "firmware::audio::chore_due",
    "firmware::audio::need_of",
    "firmware::audio::reader_check",
    "firmware::audio::Apart<firmware::audio::play_file::*>::poll",
    "firmware::audio::play_file::{closure#0}",
]

# A stream ring refill (a few times a second for MP3, about every other
# half for FLAC): the card read path.
[[cluster]]
name = "play-fill"
bins = ["firmware"]
symbols = [
    "firmware::audio::Ring>::fill_in::*",
    "orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::read::*",
    "orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::cluster_at::*",
    "orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::fat_get::*",
    "orpheus_fs::cache::Cache>::load::<yoton_bsp::card::Card>::*",
    "orpheus_fs::cache::Cache>::touch",
    "yoton_bsp::card::Card as orpheus_fs::block::BlockDevice>::read::*",
    "atj2157_hal::sd::Sd>::read::*",
    "atj2157_hal::sd::Sd>::data_command::*",
    "atj2157_hal::sd::Sd>::command::*",
    "atj2157_hal::sd::Sd>::wait_ts::*",
    "atj2157_hal::sd::Sd>::check_state",
    # The busy wait after a CMD12 (PERF-SD round 2: DAT0, U-SD-4); every
    # multi-block read ends with one.
    "atj2157_hal::sd::Sd>::wait_dat0::*",
]

# A games card operation while music plays (`serve:games`, `job:games`:
# a save rewritten in place, a save or the score table read, the saves
# looked for, the volume flushed in steps). On the player (2026-11-25,
# MP3 playing) a piece of 1–3 card blocks took 37–53 ms, of which 156–223
# code line loads: the path's code was in no cluster, scattered over the
# image, and its lines evicted each other. The cluster is the paged code
# reachable from the card step (`cargo xtask hot --name games-io
# --write`; `xtask stack --check` fails when it outgrows `budget_lines`).
# `stop`: what these operations never run (a new file's allocation and
# creation, the folders, a removal: `CardRun::rare_step`, once per file;
# `open`'s create and truncate branches; `write_data`'s growth, which a
# rewrite in place never needs). It runs with `play-fill` (the card reads)
# and `dir-walk` (the path lookups) and is placed between them, clear of
# both: 6 + 14 + 11 of the 32 physical lines. It shares lines with
# `mp3-frame` and `play-block` (the three playback clusters take all 32
# lines): after a piece the playback reloads at most its lines. Order
# (tuned by hand; `--write` keeps it): what runs again after every card
# wait (the write path, the busy polls' timer) first, on `mp3-frame`'s
# physical lines, which the audio task's resumption into a chore does not
# touch; the helpers `open` runs once last, on the lines shared with the
# audio task's poll (physical line 19).
[[cluster]]
# Generated by `cargo xtask hot --name games-io` from the static call graph: 29 patterns, 13457 B (14 lines); 25805 B (26 lines) of paged code are reachable from the roots. Closest to the roots first.
name = "games-io"
bins = ["firmware"]
fits_with = ["play-fill", "dir-walk"]
from = [
    "*firmware::media::Server>::games_step::*",
]
stop = [
    "*poll_apart::<*CardRun>::rare_step*",
    "*Volume<*>::create_entry::*",
    "*Volume<*>::set_len::*",
    "*Volume<*>::extend::*",
]
budget_lines = 14
symbols = [
    "<firmware::media::Server>::games_step::{closure#0}", # 2127 B, 0 calls from a root
    "<firmware::frame::Own<<firmware::media::Server>::games_step::{closure#0}> as core::future::future::Future>::poll", # 15 B, 0 calls from a root
    "<orpheus_fs::cache::Cache>::write_slot::<yoton_bsp::card::Card>::{closure#0}", # 343 B, 2 calls from a root
    "<yoton_bsp::card::Card as orpheus_fs::block::BlockDevice>::write::{closure#0}", # 531 B, 3 calls from a root
    "<atj2157_hal::sd::Sd>::write::{closure#0}", # 355 B, 4 calls from a root
    "<atj2157_hal::sd::Sd>::wait_ready::{closure#0}", # 387 B, 5 calls from a root
    "<embassy_time::timer::Timer as core::future::future::Future>::poll", # 109 B, 3 calls from a root
    "<embassy_time::timer::Timer>::after", # 107 B, 3 calls from a root
    "<orpheus_fs::cache::Cache>::flush_kinds::<yoton_bsp::card::Card>::{closure#0}", # 327 B, 3 calls from a root
    "<orpheus_fs::cache::Cache>::flush_range::<yoton_bsp::card::Card>::{closure#0}", # 277 B, 2 calls from a root
    "<orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::set_dirty_flag::{closure#0}", # 533 B, 2 calls from a root
    "<orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::raw_at::{closure#0}", # 297 B, 3 calls from a root
    "<orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::open::{closure#0}", # 1003 B, 1 calls from a root
    "<orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::write_data::{closure#0}", # 1263 B, 2 calls from a root
    "<orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::update_entry::{closure#0}", # 1623 B, 1 calls from a root
    "<orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::exfat_fix_checksum::{closure#0}", # 1075 B, 2 calls from a root
    "<orpheus_fs::volume::DateTime>::to_fat", # 125 B, 2 calls from a root
    "<orpheus_fs::file::File>::from_info", # 285 B, 2 calls from a root
    "<orpheus_fs::volume::Volume<yoton_bsp::card::Card>>::dir_spec", # 169 B, 2 calls from a root
