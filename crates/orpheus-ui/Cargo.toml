[package]
name = "orpheus-ui"
description = "UI toolkit: drawing over the RGB565 frame buffer, fonts, key grammar, navigation and widgets (05-ui-apps §5)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# `Wants::menu_key` honoured by the shell (the Games app, M14). Off in the
# firmware until it has the Games app: the check costs the key handler 8 B
# of stack, and the firmware's static stack margin is 204 B.
menu-key = []

[dependencies]
embedded-graphics-core = "0.4"

[lints]
workspace = true
