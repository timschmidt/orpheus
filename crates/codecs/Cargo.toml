[package]
name = "orpheus-codecs"
description = "Static dispatch over the built codecs (04 §2.1): one enum, one match per frame"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# This directory also holds one crate per codec (`crates/codecs/*`, members of
# the workspace); the facade's source is `lib.rs` here so that no non-crate
# subdirectory exists for the workspace glob to trip over.
[lib]
path = "lib.rs"

[features]
default = ["wav", "mp3", "flac", "vorbis", "opus", "speex"]
wav = ["dep:orpheus-codec-wav"]
mp3 = ["dep:orpheus-codec-mp3"]
flac = ["dep:orpheus-codec-flac"]
vorbis = ["dep:orpheus-codec-vorbis"]
opus = ["dep:orpheus-codec-opus"]
speex = ["dep:orpheus-codec-speex"]

[dependencies]
orpheus-audio = { path = "../orpheus-audio" }
orpheus-codec-wav = { path = "wav", optional = true }
orpheus-codec-mp3 = { path = "mp3", optional = true }
orpheus-codec-flac = { path = "flac", optional = true }
orpheus-codec-vorbis = { path = "vorbis", optional = true }
orpheus-codec-opus = { path = "opus", optional = true }
orpheus-codec-speex = { path = "speex", optional = true }

[lints]
workspace = true
