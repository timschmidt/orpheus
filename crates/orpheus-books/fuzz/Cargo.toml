# cargo-fuzz targets of orpheus-books (nightly only; 07 §3.4, VER-4):
#   cd crates/orpheus-books/fuzz && cargo +nightly fuzz run <target> ../../../tests/fuzz-corpus/<target>
# The bodies live in `src/lib.rs`; the crate's `tests/fuzz_corpus.rs`
# replays the committed corpus and regression inputs through them on stable.
[package]
name = "orpheus-books-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
orpheus-books = { path = ".." }

# Its own workspace: not part of the host workspace (nightly only).
[workspace]
members = ["."]

[[bin]]
name = "books_convert"
path = "fuzz_targets/books_convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "books_layout"
path = "fuzz_targets/books_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "books_zip"
path = "fuzz_targets/books_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "books_epub"
path = "fuzz_targets/books_epub.rs"
test = false
doc = false
bench = false
