[package]
name = "orpheus-tts"
description = "Text-to-speech: English text normalisation, NRL letter-to-sound rules, CMUdict exception lexicon, stress, prosody marks and the duration model (TTS-1); a cascade/parallel formant synthesiser with intonation, voices and a resampler (TTS-2) (04-audio §8)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# The lexicon encoder and the evaluation helpers (std; `cargo xtask
# tts-lexicon` and the accuracy tests use it). The firmware never enables it.
build = []

[dependencies]
# The synthesis engine's sample-path helpers: f32 math without fused
# multiply-add or libm (sin_turns, exp2), the xorshift noise, the soft clip
# (04 §9), so the speech renders the same samples on the host and the player.
# Only the math: no synth features (the firmware builds the synth without
# samples and the delay).
orpheus-synth = { path = "../orpheus-synth", default-features = false }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[[bench]]
name = "speech"
harness = false
