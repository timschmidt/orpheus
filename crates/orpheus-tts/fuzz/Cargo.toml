# cargo-fuzz targets of orpheus-tts (nightly only; 07 §3.4, VER-4):
#   cd crates/orpheus-tts/fuzz && cargo +nightly fuzz run <target> ../../../tests/fuzz-corpus/<target>
# The bodies live in `src/lib.rs`; the crate's `tests/fuzz_corpus.rs`
# replays the committed corpus and regression inputs through them on stable.
[package]
name = "orpheus-tts-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
orpheus-tts = { path = ".." }

# Its own workspace: not part of the host workspace (nightly only).
[workspace]
members = ["."]

[[bin]]
name = "tts_text"
path = "fuzz_targets/tts_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tts_synth"
path = "fuzz_targets/tts_synth.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tts_lexicon"
path = "fuzz_targets/tts_lexicon.rs"
test = false
doc = false
bench = false
