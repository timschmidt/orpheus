# cargo-fuzz targets of orpheus-player (nightly only; 07 §3.4, VER-4):
#   cd crates/orpheus-player/fuzz && cargo +nightly fuzz run <target> ../../../tests/fuzz-corpus/<target>
# The bodies live in `src/lib.rs`; the crate's `tests/fuzz_corpus.rs`
# replays the committed corpus and regression inputs through them on stable.
[package]
name = "orpheus-player-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
orpheus-player = { path = ".." }
orpheus-fs = { path = "../../orpheus-fs" }

# Its own workspace: not part of the host workspace (nightly only).
[workspace]
members = ["."]

[[bin]]
name = "player_queue"
path = "fuzz_targets/player_queue.rs"
test = false
doc = false
bench = false

[[bin]]
name = "player_resume"
path = "fuzz_targets/player_resume.rs"
test = false
doc = false
bench = false
