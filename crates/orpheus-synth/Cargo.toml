[package]
name = "orpheus-synth"
description = "Synthesis engine: band-limited oscillators, FM, envelopes, state-variable filter, LFOs, voices, drum models and kits, sample playback from a block source through a bounded cache, send effects, a limiter, sound banks (04-audio §9, WPs SYN-1, SYN-2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["samples", "delay"]
# Sample playback (`Kind::Sample`, kit sample hits). Off in the firmware
# until it has a card sample source (SYN-3: its code would take paged room
# for voices that cannot sound there): such notes then do not start.
samples = []
# The delay effect. Off in the firmware's MIDI build (no MIDI controller
# sends to it; its code would take paged room): set, it keeps its settings
# and adds nothing.
delay = []

[dependencies]
orpheus-dsp = { path = "../orpheus-dsp" }
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }

[lints]
workspace = true

[[bench]]
name = "synth"
harness = false

[dev-dependencies]
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }
