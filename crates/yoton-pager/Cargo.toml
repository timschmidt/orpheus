[package]
name = "yoton-pager"
description = "Demand-pager policy for the ATJ2157 (line cache, MPU region pool), host-testable"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Simulated MPU + SRAM2/3 + NOR page store driving `PagerCore` (host tests,
# `xtask` replay). Not for the device.
sim = []

[dev-dependencies]
yoton-pager = { path = ".", features = ["sim"] }

