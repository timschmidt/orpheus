[package]
name = "orpheus-apps"
description = "Screens and app logic over service traits: Home, Settings, system screens (05 §6, §7)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
orpheus-ui = { path = "../orpheus-ui" }
orpheus-power = { path = "../orpheus-power" }
orpheus-fm = { path = "../orpheus-fm" }
orpheus-steps = { path = "../orpheus-steps" }
orpheus-otp = { path = "../orpheus-otp" }
zeroize = { version = "1.8", default-features = false }
orpheus-rec = { path = "../orpheus-rec" }
orpheus-usb = { path = "../orpheus-usb" }
orpheus-update = { path = "../orpheus-update" }
orpheus-games = { path = "../orpheus-games", optional = true }
orpheus-fs = { path = "../orpheus-fs", optional = true }
orpheus-books = { path = "../orpheus-books", optional = true }
orpheus-seq = { path = "../orpheus-seq", optional = true }

[dev-dependencies]
orpheus-fs = { path = "../orpheus-fs", features = ["std"] }
# The settings tree against the real store (VER-4 headroom test).
orpheus-settings = { path = "../orpheus-settings" }
embassy-futures = "0.1"
proptest.workspace = true

[features]
# M14 Games (GAME-0/1/3, 05 §7.13): the Games app, its screens, settings,
# strings and `GamesService`. On in the firmware (since STACK, 2026-11-25),
# the simulator, the browser build and the UI fuzzer.
games = ["dep:orpheus-games", "dep:orpheus-fs", "orpheus-ui/menu-key"]
# Salvo, the artillery game (GAME-4/5): on in the firmware (since STACK,
# 2026-11-25), the simulator, the browser build and the UI fuzzer.
salvo = ["games", "orpheus-games/salvo"]
# Bricks, the brick-breaking game (GAME-6): on in the firmware, the
# simulator, the browser build and the UI fuzzer.
bricks = ["games", "orpheus-games/bricks"]
# M15 Books (BOOK-1, 05 §7.15): the Books app (library, reader, contents,
# bookmarks, go to), its settings, strings and `BooksService` over the
# `orpheus-books` core. On in the simulator, the browser build, the UI
# fuzzer and the firmware (its default feature `books` since BOOK-1/2,
# 2026-11-27).
books = ["dep:orpheus-books", "orpheus-ui/book-fonts"]
# MIDI files (MIDI-1, 04 §9): `.mid`, `.midi`, `.kar`, `.rmi` are audio in
# Files and the library. On in the simulator (which plays them through
# `orpheus-midi`) and in the firmware (the synthesiser plays them there
# since SYN-3, 2026-11-26).
midi = []
# M17 Sequencer (SEQ-1, 05 §7.16): the Sequencer app (project list, grid,
# transport, step, track and mixer screens) and `SeqService` over the
# `orpheus-seq` model. On in the simulator and the browser build; not in
# the firmware yet (no package has wired it there).
seq = ["dep:orpheus-seq"]
# A11Y-1 (05 §7.14): the screen reader's descriptions of every screen
# (`Screen::describe`), its settings in Settings › Accessibility (strings,
# rows, the word 0x0D61) and `services::reader_config`. On in the simulator,
# the browser build and the firmware (its default feature `speech`, with the
# speech voice, since PG-2, 2026-11-27).
screen-reader = ["orpheus-ui/screen-reader"]

[lints]
workspace = true
