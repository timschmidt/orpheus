[package]
name = "orpheus-midi"
description = "MIDI playback: Standard MIDI File parser with bounded streaming track cursors, tempo map, sequencer onto orpheus-synth, an own General MIDI sound set, a decoder-like player with seek, mute/solo and .kar lyrics (04-audio §9, WP MIDI-1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["samples", "delay"]
# Sample playback and the delay in the engine (off in the firmware,
# `orpheus-synth`).
samples = ["orpheus-synth/samples"]
delay = ["orpheus-synth/delay"]

[dependencies]
orpheus-synth = { path = "../orpheus-synth", default-features = false }
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }

[lints]
workspace = true

[dev-dependencies]
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }
orpheus-proto = { path = "../orpheus-proto" }
proptest.workspace = true
