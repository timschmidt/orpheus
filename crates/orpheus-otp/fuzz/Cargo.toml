# cargo-fuzz targets of orpheus-otp (nightly only; 07 §3.4, VER-4):
#   cd crates/orpheus-otp/fuzz && cargo +nightly fuzz run <target> ../../../tests/fuzz-corpus/<target>
# The bodies live in `src/lib.rs`; the crate's `tests/fuzz_corpus.rs`
# replays the committed corpus and regression inputs through them on stable.
[package]
name = "orpheus-otp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
orpheus-otp = { path = ".." }
embassy-futures = "0.1"

# Its own workspace: not part of the host workspace (nightly only).
[workspace]
members = ["."]

[[bin]]
name = "otp_uri"
path = "fuzz_targets/otp_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otp_vault"
path = "fuzz_targets/otp_vault.rs"
test = false
doc = false
bench = false
