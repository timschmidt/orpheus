[package]
name = "orpheus-otp"
description = "HOTP/TOTP, otpauth:// parsing and the encrypted authenticator vault (06-connectivity §5)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hmac = "0.13"
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false }
chacha20 = { version = "0.10", default-features = false, features = ["xchacha"] }
poly1305 = "0.9"
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
proptest.workspace = true
embassy-futures = "0.1"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }

[lints]
workspace = true
