[[journey]]
name = "recorder"
about = "Recorder ready (no recording: it would write /Recordings) and its menu"
script = """
next*4 ok wait:500 expect-screen:Recorder shot:recorder
menu shot:recorder_menu back
"""

[journey.shot.recorder_menu]
defaults = false
rects = [
    { x = 0, y = 0, w = 128, h = 14, why = "status bar" },
    { x = 0, y = 14, w = 128, h = 26, why = "the recorder behind the sheet" },
    { x = 88, y = 105, w = 40, h = 19, why = "Automatic gain switch (a setting)" },
]

# The vault (NOR 0x7DE000) is the owner's: never set up, wiped or written
# by a test. Whatever state it is in is accepted: locked (the PIN pad),
# none (set up), or damaged (the sector holds no vault: on the first
# full-layout player it still held the pre-switch bytes, STATUS).
[[journey]]
name = "authenticator"
about = "Authenticator as the vault is: PIN pad, set-up or damaged (no PIN entered, no secrets)"
variants = [
    { name = "locked", sim = "set:vault=locked" },
    { name = "none", sim = "set:vault=absent" },
    { name = "damaged", sim = "set:vault=damaged" },
]
script = """
next*8 ok wait:200 expect-screen:Authenticator shot:auth
"""

# The rows follow the card: `/Images` (else "No Images folder…") and the
# test images in `/.orpheus/images` (left by `usbimage-test`).
[[journey]]
name = "usbdrive"
about = "USB Drive app: its home list (no image is presented)"
variants = [
    { name = "both", sim = "" },
    { name = "test-only", sim = "set:driveimages=0" },
    { name = "images-only", sim = "set:drivetest=0" },
    { name = "neither", sim = "set:driveimages=0 set:drivetest=0" },
]
script = """
next*9 ok expect-screen:UsbDrive shot:home back
"""

# Games (M14, on Home since GAME-2's integration): the list only. Opening
# it reads the score table and looks for save files (reads only); a
# game's value ("Continue" or its best) follows what the player played,
# so it is masked.
[[journey]]
name = "games"
about = "Games app: the list of games (values masked)"
script = """
prev*2 ok wait:300 expect-screen:Games shot:list back
"""

[journey.shot.list]
rects = [
    { x = 42, y = 33, w = 86, h = 77, why = "the games' values (four rows; Salvo in the firmware since STACK 2026-11-25): Continue or the best result, and the end of a label shortened to fit it (\"Solita…\" beside Continue, 2026-11-25)" },
    { x = 122, y = 12, w = 6, h = 104, why = "scrollbar: the simulator and the firmware list five games (Salvo, Bricks); kept masked while the counts may differ" },
]

# VER-13 (07 §5.12): Settings › Playback › Shuffle on the player. The
# setting is changed only through the RAM-only settings test session (the
# first line stops the journey unless the session is on: the owner's
# stored settings are never written; the reboot that ends the suite brings
# them back) and set to Off again before the end. The queue's `shuf=` in
# `status` follows it (0 → 1 → 0, whatever the owner's value was).
[[journey]]
name = "settings_shuffle"
about = "Shuffle (0x0201) through the RAM-only test session: status shuf= follows it; set back to Off (the Playback group is shot first, before anything plays: the simulator keeps a now-playing strip after `stop`, the player does not)"
setup = true
script = """
prev ok expect-screen:Settings down ok expect-screen:SettingsGroup wait:500 shot:playback back back
expect-screen:Home
cmd: settings test-session ~ ^test-session on
cmd: playdir /.orpheus/test/suite/music ~ ^playdir ok
sim: set:queue=takk
dev: wait:1500
cmd: settings test-set 0x0201 0 ~ ^test-set 513=0 ok
dev: wait:1000
cmd: status ~ ^playing .*shuf=0
cmd: settings test-set 0x0201 1 ~ ^test-set 513=1 ok
dev: wait:1000
cmd: status ~ ^playing .*shuf=1
cmd: settings test-set 0x0201 0 ~ ^test-set 513=0 ok
dev: wait:1000
cmd: status ~ ^playing .*shuf=0
cmd: stop
sim: set:playing=0
"""

# VER-13 (2026-11-26): Settings › Sound › Key click and Fade on pause on
# the player, through the RAM-only session as above. `status` clicks=
# counts the clicks the card task sounded (keys on Home with nothing
# playing); fade= is the last pause's fade-out in ms (0: the DAC stopped
# at once, 60: faded). Both end at their defaults (click off, fade on).
[[journey]]
name = "settings_sound"
about = "Key click (0x0108) and Fade on pause (0x0109) through the RAM-only test session: status clicks= counts the clicks sounded, fade= is the last pause's fade (0 off, 60 on); both set back to their defaults"
setup = true
script = """
prev ok expect-screen:Settings ok expect-screen:SettingsGroup wait:500 shot:sound back back
expect-screen:Home
cmd: settings test-session ~ ^test-session on
cmd: settings test-set 0x0108 1 ~ ^test-set 264=1 ok
dev: wait:500
next prev next
dev: wait:1000
cmd: status ~ clicks=[1-9]
cmd: settings test-set 0x0108 0 ~ ^test-set 264=0 ok
cmd: settings test-set 0x0109 0 ~ ^test-set 265=0 ok
cmd: playdir /.orpheus/test/suite/music ~ ^playdir ok
sim: set:queue=takk
dev: wait:1500
ok wait:300 expect-screen:Music ok wait:300 expect-screen:NowPlaying
ok
dev: wait:1000
cmd: status ~ fade=0 gapless
ok
dev: wait:1000
cmd: settings test-set 0x0109 1 ~ ^test-set 265=1 ok
dev: wait:500
ok
dev: wait:1000
cmd: status ~ fade=60 gapless
cmd: stop
sim: set:playing=0
"""

# VER-13 (2026-11-26): Settings › Playback › Gapless and Seek step on the
# player (Repeat All for the run, so the second track's end leads back to
# the first). Next held with the 30 s step takes the 30 s fixture to its
# end: with Gapless off the next track starts fresh (status gapless=0);
# with it on and the 10 s step, the track plays out and is handed over
# gaplessly (gapless=1). All three set back to their defaults.
[[journey]]
name = "settings_playback"
about = "Gapless (0x0203) and Seek step (0x0205) through the RAM-only test session with Repeat All: Next held seeks by the step; a track's end starts the next fresh with Gapless off (status gapless=0), gaplessly with it on (gapless=1); all set back"
setup = true
script = """
prev ok expect-screen:Settings down ok expect-screen:SettingsGroup wait:500 shot:playback back back
expect-screen:Home
next
cmd: settings test-session ~ ^test-session on
cmd: settings test-set 0x0202 2 ~ ^test-set 514=2 ok
cmd: settings test-set 0x0203 0 ~ ^test-set 515=0 ok
cmd: settings test-set 0x0205 3 ~ ^test-set 517=3 ok
cmd: playdir /.orpheus/test/suite/music ~ ^playdir ok
sim: set:queue=takk
dev: wait:1500
ok wait:300 expect-screen:Music ok wait:300 expect-screen:NowPlaying
hold:next:550
sim: set:pos=9999999 wait:300
dev: wait:3000
cmd: status ~ ^playing .*gapless=0
cmd: settings test-set 0x0203 1 ~ ^test-set 515=1 ok
cmd: settings test-set 0x0205 2 ~ ^test-set 517=2 ok
dev: wait:500
hold:next:550
sim: set:pos=9999999 wait:300
dev: wait:22000
cmd: status ~ ^playing .*gapless=1
cmd: stop
sim: set:playing=0
cmd: settings test-set 0x0205 1 ~ ^test-set 517=1 ok
cmd: settings test-set 0x0202 0 ~ ^test-set 514=0 ok
"""

[[journey]]
name = "settings_screen_timers"
about = "Backlight timeout (0x0302) and Lock delay (0x0303) through the RAM-only test session (VER-13): ui top shows the screen off 5 s after the last key, on again at a key (Back, which only wakes it), the keys locked 5 s after the next timeout; both set back to their defaults, which holds the timers again with the screen on and the keys free"
script = """
expect-screen:Home
cmd: settings test-session ~ ^test-session on
cmd: settings test-set 0x0303 4 ~ ^test-set 771=4 ok
cmd: settings test-set 0x0302 0 ~ ^test-set 770=0 ok
wait:6500
cmd: ui top ~ locked=0 screen=0
back wait:300
cmd: ui top ~ locked=0 screen=1
cmd: settings test-set 0x0303 1 ~ ^test-set 771=1 ok
wait:11500
cmd: ui top ~ locked=1 screen=0
cmd: settings test-set 0x0302 2 ~ ^test-set 770=2 ok
cmd: settings test-set 0x0303 0 ~ ^test-set 771=0 ok
cmd: ui top ~ locked=0 screen=1
expect-screen:Home shot:home_after
"""

[[journey]]
name = "settings_screen_saver"
about = "Screen saver (0x0307) through the RAM-only test session (VER-13): with the test look off for the journey (it reads the look's settings as their defaults), Clock and a 5 s backlight timeout put the saver on the panel (ui top saver=1, screen=0); a key brings Home back; everything set back and the look on again"
script = """
expect-screen:Home
cmd: settings test-session ~ ^test-session on
cmd: settings test-set 0x0303 4 ~ ^test-set 771=4 ok
cmd: settings test-set 0x0307 1 ~ ^test-set 775=1 ok
cmd: ui test-look off ~ ^test-look off
cmd: settings test-set 0x0302 0 ~ ^test-set 770=0 ok
wait:6500
cmd: ui top ~ screen=0 .*saver=1
back wait:300
cmd: ui top ~ screen=1
cmd: settings test-set 0x0302 2 ~ ^test-set 770=2 ok
cmd: settings test-set 0x0307 0 ~ ^test-set 775=0 ok
cmd: settings test-set 0x0303 0 ~ ^test-set 771=0 ok
cmd: ui test-look on ~ ^test-look on
cmd: ui top ~ locked=0 screen=1
expect-screen:Home shot:home_after
"""
