    { x = 0, y = 0, w = 128, h = 14, why = "status bar" },
    { x = 0, y = 14, w = 128, h = 26, why = "the count behind the sheet" },
    { x = 48, y = 48, w = 80, h = 80, why = "goal, stride, weight, units (settings)" },
]

[[journey]]
