# On-device functional suite (VER-7, 07 §5.7): `cargo xtask dev suite`.
#
# Each journey is a script in the simulator's language (sim/src/lib.rs).
# The runner starts it at Home (long Back, Home's focus moved to the first
# app by matching the screenshot) and ends it with a long Back, which must
# reach Home. Every `shot:` is compared with the frame the simulator draws
# for the same journey (tests/suite/expected/<journey>/<shot>.png, rewritten
# by `--update-expected`) under the masks of masks.toml.
#
# Lines:
#   keys …               on both (taps, hold:, press:/release:, wait:,
#                        shot:, expect-screen:); never Power (CLAUDE.md rule 4)
#   sim: …               simulator only: set:/goto: to put the fake
#                        services where the player is
#   dev: …               player only (a longer wait for the card)
#   cmd: TEXT [~ REGEX]  player only: firmware test command; the reply must
#                        match REGEX within 5 s, else the journey stops
#                        (later steps rely on it)
#
# A journey's `variants` are states of the player it accepts, each as
# simulator commands run before it (expected frames `<shot>.<variant>.png`;
# a shot passes if it matches one): the owner's vault, the card's folders
# and the clock are never changed to suit a test. A shot that does not
# match at once is read again for up to 6 s (list marquees, the 1 s loop).
#
# Nothing here writes to the card outside /.orpheus/ (rule 5), switches
# the Bluetooth module (rule 6), records, or changes a setting: journeys
# open, look and go back. The order below is the run order.
#
# The player must be in Dark, Blue, English (the simulator's defaults),
# with all Home apps shown and nothing playing (the suite sends `stop`).
# `ui test-look on` gives the look; `appearance` gives the simulator the
# player's fixed facts: the full-flash layout (D-2, no "Start original
# firmware" in Settings › System).

appearance = "set:dual=0"

[[journey]]
name = "home"
about = "Home grid: app names in the strip, Home menu, quick panel"
script = """
expect-screen:Home shot:home
next*4 shot:home_recorder
next*6 shot:home_games
next shot:home_settings
menu shot:home_menu back
hold:menu expect-screen:QuickPanel shot:quick back
expect-screen:Home
"""

[[journey]]
name = "settings"
about = "Settings root and the first rows of all 12 groups (values masked)"
script = """
prev ok expect-screen:Settings shot:settings
ok expect-screen:SettingsGroup shot:sound back down
ok expect-screen:SettingsGroup shot:playback back down
ok expect-screen:SettingsGroup shot:display back down
ok expect-screen:SettingsGroup shot:power back down
ok expect-screen:SettingsGroup shot:datetime back down
ok expect-screen:SettingsGroup shot:bluetooth back down
ok expect-screen:SettingsGroup shot:radio back down
ok expect-screen:SettingsGroup shot:recording back down
ok expect-screen:SettingsGroup shot:usb back down
ok expect-screen:SettingsGroup shot:language back down
ok expect-screen:SettingsGroup shot:storage back down
ok expect-screen:SettingsGroup shot:system back
expect-screen:Settings
"""

[journey.shot.usb]
rects = [{ x = 0, y = 34, w = 84, h = 17, why = "focused row's scrolling label (marquee timing)" }]

[[journey]]
name = "system"
about = "Information screens: About, Battery, Card (figures masked)"
script = """
prev ok down*11 ok ok expect-screen:Info shot:about back back
up*8 ok down*4 ok expect-screen:Info shot:battery back back
down*7 ok ok expect-screen:Info shot:card back back
expect-screen:Settings
"""

# A label is shortened to fit its value: the serial is the player's own.
# The full-layout player has a "Firmware slot" row the simulator lacks
# (T-6, 2026-11-24): rows 3–4 differ until the simulator shows a slot.
[journey.shot.about]
rects = [
    { x = 24, y = 71, w = 24, h = 19, why = "Serial number label (shortened to fit the player's serial)" },
    { x = 0, y = 71, w = 128, h = 38, why = "Firmware slot row on the full-layout player (the simulator has no slot)" },
]

[[journey]]
name = "usb"
about = "Settings › USB and the When-connected choice (the dialog itself needs a cable event)"
script = """
prev ok down*8 ok expect-screen:SettingsGroup shot:usb_group
ok expect-screen:Choice shot:usb_when back
expect-screen:SettingsGroup
"""

# The focused first row's label ("When connected") is too long and scrolls;
# on the player the suite's reads land mid-scroll (2026-11-25, open:
# the marquee's rest vs the 6 s retry). The label is checked at rest in
# other shots; its value and the other rows stay compared.
[journey.shot.usb_group]
rects = [{ x = 0, y = 34, w = 84, h = 17, why = "focused row's scrolling label (marquee timing)" }]

[[journey]]
name = "files"
about = "Files at the card root (listing masked) and its menu"
card = true
script = """
next ok expect-screen:Files wait:300 shot:files
menu shot:files_menu back
"""

# The sheet is compared; the listing above it is not. Its rows are a
# folder's (the first entry at the card root must be a folder).
[journey.shot.files_menu]
defaults = false
rects = [
    { x = 0, y = 0, w = 128, h = 14, why = "status bar" },
    { x = 0, y = 14, w = 128, h = 29, why = "card listing behind the sheet (its scroll bar beside the sheet's corners)" },
]

# Music's rows depend on the player's history (Now playing, Resume, the
# library being built): Folders is reached from the end (Up rolls round
# to Bookmarks, then Folders).
[[journey]]
name = "music"
about = "Music root and Folders (rows and listing masked)"
card = true
script = """
ok expect-screen:Music wait:300 shot:music
up*2 ok expect-screen:Folders wait:300 shot:folders back
expect-screen:Music
"""

[[journey]]
name = "nowplaying"
about = "Now Playing over the fixture tones, playback status without underruns, its menu"
setup = true
script = """
cmd: playdir /.orpheus/test/suite/music ~ ^playdir ok
sim: set:queue=takk
dev: wait:1500
# Playing, so Music's first row is Now playing (not Shuffle all).
cmd: status ~ ^playing
ok expect-screen:Music
ok expect-screen:NowPlaying wait:300 shot:np
cmd: status ~ ^playing .*underruns=0\\b
menu shot:np_menu back
cmd: stop
sim: set:playing=0
"""

[journey.shot.np_menu]
defaults = false
rects = [
    { x = 0, y = 0, w = 128, h = 14, why = "status bar" },
    { x = 0, y = 14, w = 128, h = 26, why = "Now Playing behind the sheet" },
    { x = 88, y = 48, w = 40, h = 19, why = "Shuffle switch (a setting)" },
]

[[journey]]
name = "pictures"
about = "Pictures at the card root (listing masked) and its menu"
card = true
script = """
next*5 ok expect-screen:Pictures wait:300 shot:pictures
menu shot:pictures_menu back
"""

[journey.shot.pictures_menu]
defaults = false
rects = [
    { x = 0, y = 0, w = 128, h = 14, why = "status bar" },
    { x = 0, y = 14, w = 128, h = 29, why = "card listing behind the sheet (its scroll bar beside the sheet's corners)" },
    { x = 88, y = 105, w = 40, h = 19, why = "Show hidden switch (a setting)" },
]

[[journey]]
name = "bluetooth"
about = "Bluetooth app as it is (no switch: CLAUDE.md rule 6)"
script = """
next*3 ok expect-screen:Bluetooth shot:bt
down*2 shot:bt_rows
"""

[[journey]]
name = "radio"
about = "Radio: open, tuner status, menu, radio off with a long OK"
script = """
next*2 ok wait:1100 expect-screen:Radio shot:radio
cmd: fm status ~ phase=
menu shot:radio_menu back
hold:ok wait:2200 shot:radio_off
cmd: fm status ~ phase=
"""

[journey.shot.radio_menu]
defaults = false
rects = [
    { x = 0, y = 0, w = 128, h = 14, why = "status bar" },
    { x = 0, y = 14, w = 128, h = 26, why = "radio behind the sheet" },
    { x = 0, y = 48, w = 128, h = 19, why = "Save or Remove preset (on a preset or not)" },
    { x = 88, y = 105, w = 40, h = 19, why = "Force mono switch (a setting)" },
]

[[journey]]
name = "steps"
about = "Steps: Today, Week, menu (figures masked)"
# The footer says "No clock: no history" while the clock is not set
# (`xtask dev time --set`); the suite does not set it.
variants = [
    { name = "clock", sim = "" },
    { name = "no-clock", sim = "set:clockvalid=0" },
]
script = """
next*6 ok expect-screen:Steps shot:steps
next shot:steps_week prev
menu shot:steps_menu back
"""

[journey.shot.steps_menu]
defaults = false
rects = [
    { x = 0, y = 0, w = 128, h = 14, why = "status bar" },
    { x = 0, y = 14, w = 128, h = 26, why = "the count behind the sheet" },
    { x = 48, y = 48, w = 80, h = 80, why = "goal, stride, weight, units (settings)" },
]

[[journey]]
name = "tools"
about = "Stopwatch start/stop/reset, Timer and Alarm tabs (presets and alarms masked)"
script = """
next*7 ok expect-screen:Stopwatch shot:stopwatch
ok wait:1500 shot:stopwatch_running ok next
expect-screen:Stopwatch shot:stopwatch_reset
next shot:timer
next shot:alarm
"""

[journey.shot.stopwatch_running]
rects = [{ x = 0, y = 30, w = 128, h = 80, why = "running time and laps" }]

[journey.shot.timer]
rects = [{ x = 0, y = 30, w = 128, h = 80, why = "the timer's last duration" }]

[journey.shot.alarm]
rects = [{ x = 0, y = 30, w = 128, h = 80, why = "the owner's alarms" }]

[[journey]]
name = "recorder"
about = "Recorder ready (no recording: it would write /Recordings) and its menu"
script = """
next*4 ok wait:500 expect-screen:Recorder shot:recorder
menu shot:recorder_menu back
"""

[journey.shot.recorder_menu]
defaults = false
rects = [
    { x = 0, y = 0, w = 128, h = 14, why = "status bar" },
    { x = 0, y = 14, w = 128, h = 26, why = "the recorder behind the sheet" },
    { x = 88, y = 105, w = 40, h = 19, why = "Automatic gain switch (a setting)" },
]

# The vault (NOR 0x7DE000) is the owner's: never set up, wiped or written
# by a test. Whatever state it is in is accepted: locked (the PIN pad),
# none (set up), or damaged (the sector holds no vault: on the first
# full-layout player it still held the pre-switch bytes, STATUS).
[[journey]]
name = "authenticator"
about = "Authenticator as the vault is: PIN pad, set-up or damaged (no PIN entered, no secrets)"
variants = [
    { name = "locked", sim = "set:vault=locked" },
    { name = "none", sim = "set:vault=absent" },
    { name = "damaged", sim = "set:vault=damaged" },
]
script = """
next*8 ok wait:200 expect-screen:Authenticator shot:auth
"""

# The rows follow the card: `/Images` (else "No Images folder…") and the
# test images in `/.orpheus/images` (left by `usbimage-test`).
[[journey]]
name = "usbdrive"
about = "USB Drive app: its home list (no image is presented)"
variants = [
    { name = "both", sim = "" },
    { name = "test-only", sim = "set:driveimages=0" },
    { name = "images-only", sim = "set:drivetest=0" },
    { name = "neither", sim = "set:driveimages=0 set:drivetest=0" },
]
script = """
next*9 ok expect-screen:UsbDrive shot:home back
"""

# Games (M14, on Home since GAME-2's integration): the list only. Opening
# it reads the score table and looks for save files (reads only); a
# game's value ("Continue" or its best) follows what the player played,
# so it is masked.
[[journey]]
name = "games"
about = "Games app: the list of games (values masked)"
script = """
prev*2 ok wait:300 expect-screen:Games shot:list back
"""

[journey.shot.list]
rects = [{ x = 60, y = 33, w = 68, h = 57, why = "the games' values: Continue or the best result" }]
