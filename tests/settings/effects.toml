[[setting]]
id = "0x0101"
name = "Settings › Sound › Equaliser"
scope = "global"
values = ["Flat", "Rock", "Pop", "Jazz", "Classical", "Electronic", "Hip-hop", "Bass boost", "Vocal", "Custom 1", "Custom 2"]
default = 0
contexts = ["Equaliser", "Settings.Sound", "audio", "audio-player"]
unaffected = ["@screens", "@services"]
na = { "governor" = "review: the governor's only setting input is Performance 0x0C07 (fw ui.rs perf_max → Governor::step)", "governor-player" = "review: the governor's only setting input is Performance 0x0C07 (fw ui.rs perf_max)", "library" = "review: the library builder reads only Tag code page 0x0208 (fw services setting_to_library)", "recording-player" = "review: the recorder takes only rec_settings() (0x0801–0x080A)", "steps-player" = "review: the step counter takes only 0x0D24 and 0x0D25 (fw services)", "backlight" = "review: the backlight level follows the screen state only (fw ui.rs: 12 on, 0 off); no setting reads into it", "power" = "review: the player switches itself off only for Auto-off 0x0403 (fw ui.rs) and the sleep timer 0x0402", "clock" = "review: the RTC is set only by Set time / Set date; no setting reads into the time keeping", "keys" = "review: the locked-keys rule is fixed (orpheus-ui KeyGate::new: volume keys); no setting reads into it" }
oracle = "Audio: the five peaking bands of the preset (Custom 1/2: their bands 0x0D10–0x0D19) in the rendered sound (host: Sound::from_settings + the orpheus-dsp chain). Equaliser: the curve and the preset's name; Settings › Sound: the value."
tests = ["sim/tests/settings_matrix.rs::matrix::s0101", "sim/web/src/audio.rs::tests::settings_effects::equaliser"]
cover = { "@screens" = ["sim/tests/settings_matrix.rs::matrix::s0101"], "@services" = ["sim/tests/settings_matrix.rs::matrix::s0101"], "audio" = ["sim/web/src/audio.rs::tests::settings_effects::equaliser"] }
device = true
uncovered = { "audio-player" = "on the player the firmware's own copy of the mapping (fw ui.rs → media::publish_sound) feeds the audio task; no read-only command reports the applied Sound or a rendered-block CRC to compare in a journey yet (needs `status` to print it, or a short fixture and CRC comparison in the suite: a firmware change)" }

