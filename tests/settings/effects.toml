# Setting → effect manifest (07 §5.12, VER-13; CLAUDE.md "every setting has
# an entry"). Checked by `cargo xtask settings-matrix --check` (part of
# `xtask test all` and the gate), which derives the settings from the tree
# in `crates/orpheus-apps` (the source of truth, every feature on) and
# fails on a setting without an entry, a missing field, a context without
# a test, a test that does not exist or is ignored, or a device check that
# names no journey.
#
# One `[[setting]]` per setting with a value (actions and information rows
# have none), packed fields and their storage words included:
#
#   id         store key, "0x" and four upper-case hex digits
#   name       where it is in the UI
#   scope      "global" (every context: each context of [contexts] must be
#              in `contexts`, `unaffected` or `na`) or "local" (its app and
#              every other context that uses it)
#   values     the choices (all of them), or for a range its two ends and
#              representative values
#   default    the default (index for choices and toggles, value for ranges)
#   contexts   where the setting shows an effect ([contexts] names or
#              @groups)
#   unaffected where it must not (groups minus `contexts`); at least one
#              must be covered: the effect shown absent
#   na         (global) contexts it cannot show in, with the reason
#   oracle     what shows the effect in each context
#   tests      the differential tests (path/file.rs::module::name): the
#              same journey with the value under test and with the
#              reference value; the oracle must differ as declared and
#              every other one stay equal
#   cover      context or @group → the tests or checks that show it there
#   device     true: an effect only the player shows; `checks` names the
#              on-device checks (suite:<journey> of tests/suite/journeys.toml)
#   uncovered  context → why it has no test yet (a reviewed exclusion)
#   gap        the setting has no effect to show yet, and why (a reviewed
#              exclusion; `--strict`, the M11 gate, refuses any)
#
# The simulator matrix (`sim/tests/settings_matrix.rs`) runs every setting
# at every value against every screen context of @screens and every
# service context of @services and fails unless the frames and service
# states differ exactly where `contexts` says; it reads this file.
#
# Created by the M14 package (GAME-0/1/3, 2026-11-25) with the games'
# settings; completed by VER-13 (2026-11-25).

# ---------------------------------------------------------------- contexts
#
# Screen contexts are journeys of the simulator (`context_scripts` in
# sim/tests/settings_matrix.rs, which must name exactly the @screens
# group). Service contexts are states of the simulated services after a
# fixed journey (`service_scripts` there, @services). The rest are shown
# by host tests of their crate or only on the player.

[contexts]
"Home" = "Home: the app grid and the strip"
"Home.Menu" = "Home's menu sheet"
"Home.Playing" = "Home with music playing (the mini player in the strip)"
"QuickPanel" = "the quick panel (long Menu)"
"Volume" = "the volume overlay (Vol+ at the top)"
"PowerMenu" = "the power menu (long Power)"
"Lock" = "the lock notice"
"Charging" = "the charging screen"
"UsbConnect" = "a computer connected: the USB question or the chosen personality"
"Music" = "Music's root list"
"Folders" = "Music › Folders"
"MusicLibrary" = "Music › Artists (the library)"
"NowPlaying" = "Now Playing (default view)"
"NowPlaying.Menu" = "Now Playing's menu"
"Equaliser" = "the equaliser screen"
"Files" = "Files at the card root"
"Files.Big" = "Files in a folder of 5,000 files (sort order)"
"Files.Menu" = "Files' menu"
"TextViewer" = "the text viewer (Files) on a book"
"Pictures" = "Pictures in a folder"
"PictureViewer" = "a picture shown"
"Radio" = "the radio playing"
"RadioPresets" = "the radio's presets"
"Bluetooth" = "the Bluetooth app"
"Recorder" = "the recorder ready"
"Recorder.Recording" = "the recorder recording a tone"
"Steps" = "Steps: today"
"Steps.Week" = "Steps: the week"
"Stopwatch" = "the stopwatch tab"
"Timer" = "the timer tab (presets)"
"Alarms" = "the alarm tab"
"Alert" = "an alarm ringing"
"Authenticator" = "the authenticator (vault unlocked)"
"UsbDrive" = "the USB Drive app"
"Settings" = "Settings' root"
"Settings.Sound" = "Settings › Sound (first page)"
"Settings.Playback" = "Settings › Playback (first page)"
"Settings.Display" = "Settings › Display (first page)"
"Settings.Power" = "Settings › Power"
"Settings.DateTime" = "Settings › Date & time"
"Settings.Bluetooth" = "Settings › Bluetooth"
"Settings.Radio" = "Settings › Radio"
"Settings.Recording" = "Settings › Recording (first page)"
"Settings.Usb" = "Settings › USB (first page)"
"Settings.Language" = "Settings › Language"
"Settings.Storage" = "Settings › Storage"
"Settings.System" = "Settings › System (first page)"
"About" = "Settings › System › About"
"HomeApps" = "Settings › Display › Home screen"
"Games" = "the Games list"
"Blocks" = "Blocks playing"
"Game4096" = "4096 after two slides"
"Solitaire" = "Solitaire after a few moves"
"Salvo" = "Salvo after a shot"
"Bricks" = "Bricks after a serve"
"GamePause" = "a game's pause menu"
"Books" = "the Books library"
"Reader" = "the book reader"
"BookMenu" = "the reader's menu"
# Service contexts (the simulator's services after a fixed journey).
"playback" = "the player: queue order, track, position, state after a journey through an album"
"radio-tuner" = "the FM tuner: band, frequency, stereo, seek after tuning and a seek"
"recording" = "the recorder's file: name, format, length and content of a short recording"
"usb-keyboard" = "what the computer receives on the USB keyboard (a typed code)"
"usb-host" = "what the player offers a computer (the USB personality requested)"
"bt-module" = "the Bluetooth module's state (power, reconnect)"
"steps-counter" = "steps counted while walking"
"alarms" = "an alarm ringing at its time"
"sleep" = "the sleep timer (minutes left, the stop)"
"volume" = "the volume the keys reach"
# Host-crate contexts (a host test of the crate that does it).
"audio" = "the rendered sound of music (EQ, bass, balance, crossfeed, channels, ReplayGain): the settings → chain mapping of the browser build (sim/web Sound::from_settings) over the real orpheus-dsp chain"
"governor" = "the CPU clock level the governor picks (orpheus-power governor)"
# Player-only contexts (the firmware's own code or the hardware).
"audio-player" = "the player's rendered sound (fw ui.rs publishes media::Sound, the audio task applies it)"
"governor-player" = "the player's clock level"
"library" = "the player's library builder's tag decoding (fw library.rs)"
"recording-player" = "the player's recording (fw rec.rs over the ADC)"
"steps-player" = "the player's step counting (fw sensor task)"
"backlight" = "the backlight level and when it goes off"
"power" = "the player switching itself off"
"clock" = "the real-time clock's time keeping"
"keys" = "which keys work while the keys are locked"

[groups]
screens = [
    "Home", "Home.Menu", "Home.Playing", "QuickPanel", "Volume", "PowerMenu", "Lock", "Charging",
    "UsbConnect", "Music", "Folders", "MusicLibrary", "NowPlaying", "NowPlaying.Menu", "Equaliser",
    "Files", "Files.Big", "Files.Menu", "TextViewer", "Pictures", "PictureViewer", "Radio",
    "RadioPresets", "Bluetooth", "Recorder", "Recorder.Recording", "Steps", "Steps.Week", "Stopwatch",
    "Timer", "Alarms", "Alert", "Authenticator", "UsbDrive", "Settings", "Settings.Sound",
    "Settings.Playback", "Settings.Display", "Settings.Power", "Settings.DateTime",
    "Settings.Bluetooth", "Settings.Radio", "Settings.Recording", "Settings.Usb", "Settings.Language",
    "Settings.Storage", "Settings.System", "About", "HomeApps", "Games", "Blocks", "Game4096",
    "Solitaire", "Salvo", "Bricks", "GamePause", "Books", "Reader", "BookMenu",
]
services = [
    "playback", "radio-tuner", "recording", "usb-keyboard", "usb-host", "bt-module", "steps-counter",
    "alarms", "sleep", "volume",
]
host = ["audio", "governor"]
device = [
    "audio-player", "governor-player", "library", "recording-player", "steps-player", "backlight", "power",
    "clock", "keys",
]

# ---------------------------------------------------------------- kinds
#
# Persistence (written, read back after a reboot, the others untouched),
# defaults (fresh store, factory reset), out-of-range values (stored or
# set: the default, not the nearest end) and stores of an older firmware
# (unknown keys skipped, a record of another length, a key missing), for
# every setting of each kind (crates/orpheus-apps/src/settings.rs).

[kinds.toggle]
persist = ["crates/orpheus-apps/src/settings.rs::persistence::persist_toggle"]
default = ["crates/orpheus-apps/src/settings.rs::persistence::default_toggle"]
clamp = ["crates/orpheus-apps/src/settings.rs::persistence::clamp_toggle"]
migrate = ["crates/orpheus-apps/src/settings.rs::persistence::migrate_toggle"]

[kinds.choice]
persist = ["crates/orpheus-apps/src/settings.rs::persistence::persist_choice"]
default = ["crates/orpheus-apps/src/settings.rs::persistence::default_choice"]
clamp = ["crates/orpheus-apps/src/settings.rs::persistence::clamp_choice"]
migrate = ["crates/orpheus-apps/src/settings.rs::persistence::migrate_choice"]

[kinds.range]
persist = ["crates/orpheus-apps/src/settings.rs::persistence::persist_range"]
default = ["crates/orpheus-apps/src/settings.rs::persistence::default_range"]
clamp = ["crates/orpheus-apps/src/settings.rs::persistence::clamp_range"]
migrate = ["crates/orpheus-apps/src/settings.rs::persistence::migrate_range"]

[kinds.language]
persist = ["crates/orpheus-apps/src/settings.rs::persistence::persist_language"]
default = ["crates/orpheus-apps/src/settings.rs::persistence::default_language"]
clamp = ["crates/orpheus-apps/src/settings.rs::persistence::clamp_language"]
migrate = ["crates/orpheus-apps/src/settings.rs::persistence::migrate_language"]

[kinds.homeapps]
persist = ["crates/orpheus-apps/src/settings.rs::persistence::persist_homeapps"]
default = ["crates/orpheus-apps/src/settings.rs::persistence::default_homeapps"]
clamp = ["crates/orpheus-apps/src/settings.rs::persistence::clamp_homeapps"]
migrate = ["crates/orpheus-apps/src/settings.rs::persistence::migrate_homeapps"]

[kinds.packed]
persist = ["crates/orpheus-apps/src/settings.rs::persistence::persist_packed"]
default = ["crates/orpheus-apps/src/settings.rs::persistence::default_packed"]
clamp = ["crates/orpheus-apps/src/settings.rs::persistence::clamp_packed"]
migrate = ["crates/orpheus-apps/src/settings.rs::persistence::migrate_packed"]

