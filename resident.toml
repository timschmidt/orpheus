# What stays resident in a paged image (docs/plan/02-architecture.md §3.3,
# §3.4). Read by `cargo xtask pagelink` and `cargo xtask check-resident`.
#
# Patterns are globs (`*`, `?`) over demangled symbol names without hash
# (`atj2157_hal::rt::*`; a leading `<` is ignored, so `foo::Bar*` matches
# `<foo::Bar as baz::Q>::f`), over input section names, or over input file
# names. A section matches when any symbol defined in it matches. Fat LTO
# merges the crates into one object, so symbol names are what tells them
# apart; inlined code belongs to the function it was inlined into.
#
# Order of decisions for every code/rodata input section:
#   1. cannot move (start-up `.init`/`.vectors`, linker-generated other
#      than merged sections, mergeable input not merged by the linker,
#      section name not unique): resident
#   2. [paged] patterns: paged, even if a root reaches it (check-resident
#      then fails; for tests and for cold paths proven safe to fault)
#   3. [resident] patterns: resident
#   4. reachable from a root (relocation graph, through code, rodata and
#      RAM data): resident
#   5. rodata larger than a 16 KiB group: an ERROR (pagelink fails; split
#      the data or name it in [resident]; 2026-11-26: the UI font, 17.8 KB,
#      was resident behind a warning)
#   6. otherwise: paged
# Merged sections (the linker's `.rodata.str*` string literals and
# `.rodata.cst*` constant pools, one section each) take steps 3 and 4, then
# stay resident if any section that is not paged refers to them, else are
# paged (2026-11-26: `.rodata.str1.1`, 8 KB of panic-location file names).
# RAM sections (.data/.bss/.uninit) are never paged.

# Hard roots: their whole reference closure is made resident (pagelink) and
# checked (check-resident). `@vectors` is every vector-table entry except
# the indices in `vector_skip` (0: initial SP, 1: reset; `_start` runs before
# the pager and calls `main`, which must not pull everything in). Add the
# targets of indirect calls that check-resident lists from these roots
# (IRQ handlers registered with `rt::bind`, time-driver callbacks, DMA
# completion handlers) once they exist.
roots = ["@vectors"]
vector_skip = [0, 1]

[resident]
symbols = [
    # The pager and everything a fault touches.
    "orpheus_pager::*",
    # Start-up, vectors, IRQ dispatch, fault capture, critical section,
    # interrupt control, the time driver, the persistent area, watchdog.
    "atj2157_hal::rt::*",
    "atj2157_hal::cs::*",
    "atj2157_hal::interrupt::*",
    "atj2157_hal::time::*",
    "atj2157_hal::persist::*",
    "atj2157_hal::wdt::*",
    "critical_section::*",
    # Handlers bound at run time through `rt::bind` (the indirect `bx` in
    # `irq_dispatch`): placed resident for latency (02 §3.2 rule 3). Not
    # roots: the RT executor's entry reaches every task body, which may
    # fault by design.
    "atj2157_hal::executor::on_rt",
    "atj2157_hal::usb::on_irq",
    "atj2157_hal::dma::*",
    # Executor core, wakers, run and timer queues (not the task bodies:
    # `TaskStorage<F>::poll` is each task's future, excluded below).
    "embassy_executor::raw::*",
    "embassy_time_driver::*",
    "embassy_time_queue_utils::*",
    # The executor's timer-queue item of a waker (unmangled, so not under
    # `embassy_executor::raw::*`): every timer's wake-up runs it. Paged, it
    # straddled two lines of `games-io` that the synth's per-piece code
    # shares (SYN-3, 2026-11-26; 60 B).
    "__embassy_time_queue_item_from_waker",
    # Builtins (the library is a separate archive; see `files`).
    "memcpy",
    "memset",
    "memmove",
    "memcmp",
    "__aeabi_*",
    "compiler_builtins::*",
]
sections = [
    ".text.resident.*",
    ".rodata.resident.*",
    # The linker's constant pools (16/32-byte vectors, f32/f64 constants:
    # 3,836 B in 2026-11-26's build): the per-frame decoders (MP3 `decode`,
    # Opus CELT, the MIDI player) read them, and one merged section cannot
    # be placed per user. Paged, each would compete for the 16-line rodata
    # cache with the Opus tables (all 16 lines) and the synth's wavetable
    # (14). `cst32` is also read by `main` before the pager runs.
    ".rodata.cst*",
]
files = ["*libcompiler_builtins-*"]
exclude = [
    "embassy_executor::raw::TaskStorage<*>::poll*",
    # MP3 code that runs once per open or seek, not per frame: paged
    # (it gives ~2.5 KiB of RAM back to the stack).
    "orpheus_codec_mp3::Mp3Decoder>::find*",
    # The MP3 frame code (the decoder's `decode` with the side info,
    # scale factors, Huffman and the stereo steps inlined, 8.7 KB): paged as
    # it always was (it used to be inlined into the paged
    # `AnyDecoder::decode`), now one contiguous section packed with `find`
    # in the `mp3-frame` cluster (hot.toml, AU-PERF). Its leaf kernels
    # (synthesis, IMDCT, bit reader) stay resident.
    "orpheus_codec_mp3::Mp3Decoder as orpheus_audio::decoder::Decoder>::decode*",
    "orpheus_codec_mp3::parse_head*",
    "orpheus_codec_mp3::parse_vbr_tag*",
    "embassy_executor::raw::util::UninitCell<*",
]

[paged]
symbols = []

# Per-binary additions: [bin.NAME] with roots / resident / paged.
[bin.firmware]
# Everything `main` runs before the pager is up: the pager start-up (slot
# header read, NOR driver, PagerCore init) and the early MPU deny.
roots = [
    "firmware::start_pager",
    "firmware::find_slot",
    "atj2157_hal::pager::arm_deny",
    "atj2157_hal::log::init",
    # Audio DMA half/complete handler (`enable_irq_with`, level 1).
    "firmware::audio::on_dac_dma",
    # NOR program/erase run with interrupts masked while the chip is busy
    # and cannot be read: everything they reach (code and constants) must
    # be resident, or the pager reads a busy chip (2026-11-24: a settings
    # write executed garbage from a page loaded mid-program).
    "atj2157_hal::nor::*",
]

[bin.firmware.resident]
# `_start` calls `main` before anything maps a page. The per-block audio
# path (MP3 decoding, the DSP chain's processing) is resident: paged, with
# the UI running, it thrashed the four-slot code cache into the watchdog
# (02 §3.2 rule 6; 2026-11-24). Paid for by the 16 KiB stream ring.
symbols = [
    "main",
    "firmware::main",
    "orpheus_codec_mp3::*",
    "orpheus_dsp::chain::*process*",
    "orpheus_dsp::chain::*run*",
    "orpheus_dsp::eq::*process*",
    "orpheus_dsp::biquad::*process*",
    "orpheus_dsp::crossfeed::*process*",
    "orpheus_dsp::limiter::*process*",
    "orpheus_dsp::matrix::*process*",
    "orpheus_dsp::gain::*process*",
    "orpheus_dsp::fade::*process*",
    "orpheus_dsp::meter::*",
]

[bin.firmware.cold]
# Cold code (PG-2, 02 §3.6): paged code that may run from the rodata window
# (SRAM3's two slots, shared with the constants) instead of the code window,
# which was full (speech and Books needed 148 of its 128 pages). Only code
# that no deadline waits for: rare screens and their services, card jobs
# with budgets of their own, the developer channel's replies. Never the
# audio path, the synth, interrupt handlers (resident anyway) or anything
# a `hot.toml` cluster names (a cluster keeps its code in the code window;
# `xtask stack --check` fails when a cluster's reach enters cold code).
# A cold instruction reading a constant on its own physical line runs from
# a trampoline (`orpheus_pager::bounce`); pagelink places cold code clear of
# the lines of the constants it refers to where it can.
#
# Only as much as the code window needs leaves it: pagelink brings cold
# code back, **from the end of this list**, while the code window keeps a
# page free (`pagelink::place_cold`). So the list runs coldest first.
symbols = [
    # Books' conversion and its formats (once per book).
    "orpheus_books::convert::*",
    "*<orpheus_books::convert::*",
    "orpheus_books::epub::*",
    "*<orpheus_books::epub::*",
    "orpheus_books::inflate::*",
    "*<orpheus_books::inflate::*",
    "orpheus_books::xml::*",
    "*<orpheus_books::xml::*",
    "orpheus_books::xhtml::*",
    "*<orpheus_books::xhtml::*",
    "orpheus_books::fb2::*",
    "*<orpheus_books::fb2::*",
    "orpheus_books::opf::*",
    "*<orpheus_books::opf::*",
    "orpheus_books::zip::*",
    "orpheus_books::md::*",
    "*<orpheus_books::md::*",
    "orpheus_books::enc::*",
    "*<orpheus_books::enc::*",
    "orpheus_books::norm::*",
    "*<orpheus_books::norm::*",
    "orpheus_books::txt::*",
    # Firmware updates, the authenticator (OTP) and their hashes.
    "orpheus_update::*",
    "firmware::update::*",
    "orpheus_apps::screens::update::*",
    "orpheus_otp::*",
    "orpheus_apps::screens::auth::*",
    "sha1::*",
    "sha2::*",
    "chacha20::*",
    "chacha20poly1305::*",
    "poly1305::*",
    "orpheus_hid::*",
    # The music library's build (a card job with its own budget).
    "orpheus_library::*",
    "firmware::library::*",
    # Settings-like screens entered rarely.
    "orpheus_apps::screens::bluetooth::*",
    "orpheus_apps::screens::clocks::*",
    "orpheus_apps::screens::drive::*",
    "orpheus_apps::screens::steps::*",
    "orpheus_apps::screens::system::*",
    "orpheus_apps::screens::edit::*",
    "orpheus_apps::screens::library::*",
    # The rest of Books (05 §7.15): the shelf and the desk's jobs, the
    # layout, its screens, the firmware glue, and generic code instantiated
    # for Books' types only.
    "orpheus_books::*",
    "*<orpheus_books::*",
    "firmware::books::*",
    "*firmware::books::*",
    "orpheus_apps::screens::books::*",
    # The developer channel's commands and replies (the lead's tools; the
    # warmest: polled during tests).
    "*::test_command",
    "*::test_command::*",
    "*::status_reply",
    "*::status_reply::*",
    "firmware::usbdev::prof_command",
    "firmware::usbdev::boot_status_reply",
    "firmware::ui::top_reply",
    "firmware::ui::session_reply",
    "firmware::ui::settings_command",
    "firmware::sensor::trace_reply",
    "firmware::sensor::acc_command",
]
# Never cold: an update's data path, which runs once per byte or per
# 64-byte block over the whole 1.3 MB image (PG-2b, 2026-11-27). Cold, the
# SHA-256 round loop of `compress256` straddled the physical line of its
# round constants `K` (SRAM3 holds 16 lines for cold code and constants
# together): two line loads per round, 129 rodata faults per block, 2.5 KB/s
# instead of ≈ 35 KB/s, 8–9 min to write an image and a 16 KiB read-back
# step of ≈ 6 s, which the watchdog (5.6 s) reset. Test
# `rules::tests::regress_update_data_path_ran_from_the_rodata_window`.
exclude = [
    "<orpheus_update::install::Installer>::write::*",
    "<orpheus_update::install::Installer>::take::*",
    "<orpheus_update::install::Installer>::same::*",
    "<orpheus_update::install::Installer>::program::*",
    "<orpheus_update::install::Installer>::erase::*",
    "<orpheus_update::install::Installer>::verify_step::*",
    "<orpheus_update::install::Installer>::guard",
    "<orpheus_update::slots::Target>::allows",
    "<firmware::update::Nor as *",
    "firmware::update::usb_out",
    "firmware::update::with_usb*",
    "firmware::update::poll",
    "firmware::update::install_file*",
    "<sha2::Sha256 as digest::Update>::update",
    "sha2::sha256::*",
]

[bin.bringup-pagetoy]
# Stand-in for the MemManage handler (fw/bringup/pagetoy).
roots = ["toy_memmanage"]
