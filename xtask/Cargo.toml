[package]
name = "xtask"
description = "The one entry point for building, testing and talking to the player"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
orpheus-proto.workspace = true
orpheus-host = { path = "../crates/orpheus-host" }
orpheus-update = { path = "../crates/orpheus-update", features = ["std"] }
orpheus-pager = { path = "../crates/orpheus-pager", features = ["sim"] }
orpheus-power = { path = "../crates/orpheus-power" }
anyhow = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
toml = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-demangle = "0.1"
# BRAND-1 / WEB-1: icons and the social card from the lyre SVG, the site's
# Markdown, the documentation screenshots.
orpheus-ui = { path = "../crates/orpheus-ui" }
resvg = { version = "0.48", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
png = "0.18"
# WEB-2: gzip sizes of the browser build.
flate2 = "1"
# VER-7/8: the on-device suite and fuzzer run journeys in the simulator
# (expected frames), key indices of the developer channel, reply checks.
orpheus-sim = { path = "../sim" }
orpheus-apps = { path = "../crates/orpheus-apps", features = ["games"] }
orpheus-input = { path = "../crates/orpheus-input" }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[lints]
workspace = true
