name: Feature request
description: Something Orpheus should do that it does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Many features are already planned: please look at docs/plan/08-milestones.md and docs/STATUS.md first.
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What you would like the player to do, and what you would use it for.
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Work package
      description: If it belongs to a planned work package, its id (for example AU-5).
