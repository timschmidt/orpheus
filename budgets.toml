[synth]
# The synthesiser on the player (04 §9, SYN-3, 2026-11-26).
#
# RAM: no static RAM of its own but the `syn:` statistics (four 4-byte
# words since the governor's clock and paging fields, 2026-11-26: .bss
# 124,240 B by `xtask size`, was 124,232 at build 78b316b5; the fourth
# word holds the paging share and the clock pin). A synth source takes the
# pool (stream ring + decoder arena less the library's 1,104 B build
# state). Measured on thumbv7em (`size_of`, a const assertion in
# `audio::synth` checks they fit): MIDI state 71,936 B (`MidiPlayer`
# 70,528 = engine 62,624 + parser 6,224 + …; block cache tags 340, the
# load governor 40, one 256-frame block); then 13 card blocks (6,656 B),
# 2,224 B spare for card work while it plays. The load governor added
# 296 B: 256 for the two wet buffers an effect fades out through
# (`Engine::set_fx_enabled`), 8 for the effect switches, 32 for the
# governor's state (`orpheus_synth::load::Governor`, was `VoiceGov`).
# The measurement and clock fix (2026-11-26) grew the governor 40 → 60 B
# (paging, the piece-length ratio, warm-up, give-up count, clock step,
# top and pin): MIDI state 71,936 → 71,960 B with the state's 8-byte
# alignment (computed from the field sizes; `synth bench` with no
# argument prints the measured `midi_state=`).
pool_bytes = 80816
midi_state_bytes = 71960
engine_bytes = 62624
# Rendering: 44.1 kHz, pieces of 32–256 frames, clock floor High
# (144 MHz) while a synth source plays. The load governor
# (`orpheus_synth::load`) predicts each piece from the costs below × the
# measured compute ratio, plus the measured paging, and keeps the render
# under 55 % of real time (1,795 of 3,265 cycles a frame at 144 MHz):
# first the clock up (D-4: Turbo 192, Max 288 MHz, the lowest that fits;
# not in Battery saver), then at Max chorus off, delay, reverb, then
# voices (released first, oldest first; the limit for new notes), never
# below 2; undone after 1 s (voices: as many as fit 50 %) / 3 s (an
# effect) under 50 %, then the clock a step down after 2 s under 50 % of
# the lower clock. A piece is at most 4 ms (its frames from the
# prediction and the last piece's raw ratio); the pace rule rests 4 ms
# before a piece that would end 8 ms after the last rest. The ratio is
# not measured for 250 ms after an open or a seek and rises at most 3 %
# a block. A song is ended only when nothing can play (everything shed
# at the top clock, 200 % of real time for 5 s of render time).
voices_max = 16
voices_min = 2
budget_pct = 55
restore_pct = 50
piece_us_max = 4000
clocks_mhz = [144, 192, 288]
calm_clock_ms = 2000
warm_ms = 250
ratio_rise_pct_per_block = 3
give_up_pct = 200
give_up_ms = 5000
# Cycles per frame on the player at 144 MHz, MEASURED 2026-11-26 by
# `synth bench` (build 1fda608d; no DWT on the chip: µs × 144; pager
# line loads included, as playback sees them): per voice = (load − empty)
# / voices; per effect = the effect's load with one sine voice − the same
# voice into the (compiled-out) delay, and with eight voices; the larger.
# 1.7–3.7 × the SYN-1/2 estimates (instructions + 1 per load/store),
# which did not count the code page cache's and SRAM's wait states: the
# measured ratio is ≈ 2.5 cycles per instruction at opt-level "s".
# `orpheus_synth::load::PLAYER` holds the table the governor uses.
cycles_empty_frame = 245
cycles_sine = 155
cycles_subtractive = 280          # presets 167–308, median 246; the table's value
cycles_saw_lead = 262
cycles_square_bass = 282
cycles_pwm_pad = 308
cycles_strings = 263
cycles_fm_2op = 288               # fm-bell 288, fm-bass 287
cycles_fm_4op = 453               # fm-epiano
cycles_kick = 296
cycles_snare = 388
cycles_closed_hat = 696
cycles_open_hat = 695
cycles_clap = 159
cycles_tom = 256
cycles_cymbal = 737
# Effects: the reverb 1,318 − 647 = 671 (one sine voice) / 2,996 − 2,344
# = 652 (eight saw voices); the chorus 764 − 647 = 117 / 2,905 − 2,711 =
# 194. (The first reading, 1,073 and 519, also counted the sine voice and
# its line loads.) The reverb is compute: +0.4 line loads a block over the
# dry load (≈ 40 cycles a frame); its 8-line network already runs at half
# rate; a step-by-step rewrite (bit-exact, 15 % faster on the host) has
# more instructions a frame on thumbv7em (≈ 313 against ≈ 255) and was
# not kept (04 §9).
cycles_reverb_frame = 671
cycles_chorus_frame = 194
# The delay is compiled out of the firmware (feature `delay` off: no MIDI
# controller feeds it; its code would not fit the code window). ESTIMATE:
# SYN-2's 90 × 2.3.
est_cycles_delay_frame = 210
# Code paging (2026-11-26; the lead's run of build 8240f128: `pg=`
# 200–250 % of real time at 288 MHz, every demo song given up). The
# steady MIDI working set in code-cache lines (`hot.toml`, `cargo xtask
# build` prints them): the render with everything it calls every segment
# (`synth-render`, 18,360 B), the per-piece code (`synth-inner`, 7,882 B:
# the pieces' loop, the governor, the render call with the MIDI event
# loop, the rest), the PCM path shared with the codecs (`play-pcm`,
# 5,010 B): 31 of the cache's 32 lines, on distinct physical lines; `xtask
# stack --check` fails when the render's reachable code outgrows
# `budget_lines` 18 or the three outgrow 32 (was 25 + 9 = 34). The outer
# loop (requests, position, chores) runs every `outer_frames` or when
# something waits. A host model (the render emulated per piece, replayed
# through the cache; STATUS 2026-11-26) gives line loads 2.3 a piece for
# "Etude", `pg=` (render only) 3.2 % and 6.9 % with the rest of the loop,
# against 96 a piece (291 %) on the old layout. Resident +160 B
# (81,652 → 81,812 B: the rest's wake through the time queue, which is
# resident by name, instead of `embassy_time::Timer`, and the timer
# queue's item lookup).
render_lines = 18
inner_lines = 8
pcm_lines = 5
outer_frames = 4096

[tts]
