code_bytes = 81920                  # 80 KiB (04 §8)
# RAM of the speech build over the default one: .bss +9,736 B (the
# speaker 3,448 B, the sample ring 4,096 B, the utterance queue 1,040 B,
# the UI's reader state ≈ 900 B, signals and counters), .data +276 B (the
