# RAM and size budgets (docs/plan/02-architecture.md §1.2, 07 §4.2).
# Enforced by `cargo xtask size --check`. Raising a number needs the measured
# value and the reason in the same commit.

[firmware]
# Resident image: .text + .rodata + .data loaded at 0x100000.
# 2026-11-24: 72 -> 80 KiB. Measured 76,130 B. Reason: the per-block audio
# path (MP3 decoder incl. its 17.8 KB Huffman tables, the DSP stages'
# process functions; resident.toml) is resident because paged it thrashed
# the 4-slot code cache into the watchdog, and the NOR driver is a residency
# root because a page fault while the chip programs executed garbage.
# 2026-11-25 (T-8): 80,012 B measured; the profilers take 656 B of it
# (PC sampler entry and handler, fault-log call and ring push: resident
# because the T2 vector and the MemManage handler reach them). Their ring
# is the 2 KiB profiler block in SRAM3 at 0x307000, outside these
# budgets: the log ring's first placement, never used (the log runs in
# SRAM0), so no other user loses RAM; SRAM0 gains 8 B of flags.
resident_bytes = 81920          # 80 KiB
# Static RAM in SRAM0 (.bss + .uninit, excluding the stack).
# 2026-11-24: 20 -> 124 KiB. Measured 123,000 B. Reason: the mode pool is
# not a separate region yet; the decoder arena (64 KiB) and the stream ring
# (16 KiB) live in .bss (80 KiB of the planned 104 KiB pool), plus ~43 KiB of
# statics (UI task 9.4 KiB, browse/text windows ~9 KiB, DSP chain 4 KiB, FS
# cache 4 KiB, USB 6 KiB, card task 6 KiB, ...). The stack takes the rest of
# SRAM0 (27 KiB; measured peak ~21.5 KiB).
bss_bytes = 126976              # 124 KiB
caches_bytes = 8192
mode_pool_bytes = 106496        # 104 KiB
stack_bytes = 12288             # 12 KiB
# Static worst case of the one MSP stack (`cargo xtask stack --check`,
# stack.toml, 07 §4.4): usable stack (above the MPU guard) minus the nested
# worst case must be at least this. The goal was +4096. 2026-11-25 (VER-10):
# measured -884 B (22,900 B nested worst case of 22,016 B usable; it was
# >= 30,232 B of 21,760 B before VER-10's fixes); after AU-PERF 204 B
# (21,812 of 22,016 B). 2026-11-25 (VER-10, card task frames): measured
# 6,340 B (16,188 B nested worst case of 22,528 B usable: the volume and
# the decoder no longer move by value through the card task's poll
# frames, the idle loop's and start-up's children are futures of their
# own; .bss -512 B, the audio task's future). A ratchet at the measured
# margin less one 256 B step: the usable size moves by 256 B with .bss
# (the guard is aligned to 256 B; `__stack_bottom` 0x131B00 is on a step).
# 2026-11-25: `settings changed` (+8 B resident) crossed one step: margin
# 6,340 -> 6,076 B; ratchet at that less one step.
# 2026-11-25 (GAME-2, the Games app on the player): measured 4,268 B
# (16,212 B nested worst case of 20,480 B usable). Static RAM +1.9 KB:
# the games' hub (848 B) with its card queue (`GamesRam`, 872 B, .bss),
# the 512 B card buffer, settings cache +22 keys; usable stack 22,528 ->
# 20,480 B (eight 256 B steps; `__bss_end` 0x1322A0, 96 B below the next
# step). Thread context 6,876 -> 6,900 B. The ratchet is the VER-10 goal
# itself (one step less would allow < 4 KiB): the next static step needs
# a stack cut first.
# 2026-11-25 (STACK, Salvo on in the firmware): .bss +368 B moved the
# stack's start two more steps (usable 19,712 B); the Authenticator's
# finishes, a code's entry read and the games' decoding cut the UI task's
# deepest path 6,796 -> 5,840 B: measured 4,560 B (15,152 B nested worst
# case). Budget unchanged.
stack_static_margin_bytes = 4096
# Firmware partition in the dual-boot layout (slot A): the whole "YFW1"
# image (header sector, resident image, page store).
slot_bytes_dual = 491520        # 480 KiB
# Full layout (02 §2.4, D-2 decided 2026-11-24): slot A 0x1000..0x200000.
slot_bytes_full = 2093056       # 2044 KiB
# Page store (02 §3.1): what the alias windows can address.
code_pages = 128
rodata_pages = 48
# Panic sites in the resident image (core::panicking callers). Growth needs
# a STATUS.md entry.
resident_panic_sites = 0

[hil]
# On-device sessions (VER-7 suite, VER-8 fuzz-ui, 07 §5.7): the stack's
# free bytes (INFO, painted at boot) must stay at or above this. The stack
# is the rest of SRAM0 (≈ 27 KiB); measured peak ≈ 21.5 KiB (≈ 5.5 KiB
# free, 2026-11-24): 2 KiB is the margin a fuzz session may not eat into.
stack_free_min_bytes = 2048

[soak]
# Long soaks (VER-12, 07 §5.10: `cargo xtask dev soak`). First values,
# from the measurements in docs/STATUS.md (2026-11-24): 48 kHz MP3
# playback takes ≈ 2,670–3,220 NOR line loads/s (Home or browsing a large
# folder, 0 underruns); evictions are not measured yet (≤ loads by
# construction). The first soaks measure them; tighten from those runs.
# Oracles are read every `sample_every_s`.
sample_every_s = 10
# Mean over the whole run (≈ the MP3 figure plus browsing).
loads_per_s_mean_max = 4500
# A thrash episode: above this for `thrash_samples` samples in a row
# (≈ 2× the measured playback rate).
loads_per_s_max = 7000
evictions_per_s_max = 7000
thrash_samples = 3
# Seeks, track and source changes, card hand-over and clock changes open a
# window in which underruns are allowed, at most this many per window;
# none outside (07 §5.10).
seek_window_s = 10
underruns_per_disruption_max = 6
# The DAC's headroom low-water (frames, STATS word 21) outside those
# windows: ≤ 0 means the DAC played stale data.
head_min_frames = 1
card_errors_max = 0
pager_load_errors_max = 0
# Played samples against the host's clock, over at least 300 s of
# uninterrupted playback. Crystal tolerance is ±100 ppm, but the DAC rate
# was measured +0.15 % (≈ +1,500 ppm) against T0 (U-AUD-10, open): the
# limit stays above that until it is resolved.
drift_ppm_max = 2500
drift_min_window_s = 300
# The uptime (T0, measured 2.5 ppm off) against the host's clock.
clock_ppm_max = 300
# `--battery` (charging paused, the drain logger on) stops here.
battery_min_mv = 3550
# Recordings per run (ADPCM, ≤ 12 s each, under /.orpheus/test/rec/soak/).
max_recordings = 24

[bringup]
# RAM-loaded images end below ymon (0x118000).
image_bytes = 98304             # 96 KiB
# Paged bring-up images (fw/bringup/pagetoy): the window limits.
code_pages = 128
rodata_pages = 48
slot_bytes_dual = 491520

[stage2]
image_bytes = 1024

[web]
# The browser build (WEB-2, 09 §4; `cargo xtask wasm` enforces the first).
# Module with its embedded data (demo card), wasm-bindgen glue and the
# page's own scripts and styles, gzip as GitHub Pages serves them.
total_gzip_bytes = 4000000      # 4 MB
# The browser installer (WEB-3; `cargo xtask wasm` enforces it): the
# orpheus-install-web module, its glue and site/install/*, gzip.
install_gzip_bytes = 300000     # 300 KB
# Checked by the page's self-test (`xtask wasm --test`, tests/web/try.mjs):
# first frame after navigation, mean and worst simulation + draw time per
# animation frame, audio underruns while playing.
first_screen_ms = 2000
frame_mean_ms = 4
frame_worst_ms = 16
audio_underruns = 0

[synth]
# The synthesiser on the player (04 §9, SYN-3, 2026-11-26).
#
# RAM: no static RAM of its own but the `syn:` statistics (three 4-byte
# words since the load governor: .bss 124,208 B). A synth source takes the
# pool (stream ring + decoder arena less the library's 1,104 B build
# state). Measured on thumbv7em (`size_of`, a const assertion in
# `audio::synth` checks they fit): MIDI state 71,936 B (`MidiPlayer`
# 70,528 = engine 62,624 + parser 6,224 + …; block cache tags 340, the
# load governor 40, one 256-frame block); then 13 card blocks (6,656 B),
# 2,224 B spare for card work while it plays. The load governor added
# 296 B: 256 for the two wet buffers an effect fades out through
# (`Engine::set_fx_enabled`), 8 for the effect switches, 32 for the
# governor's state (`orpheus_synth::load::Governor`, was `VoiceGov`).
pool_bytes = 80816
midi_state_bytes = 71936
engine_bytes = 62624
# Rendering: 44.1 kHz, pieces of 32–256 frames, clock floor High
# (144 MHz) while a synth source plays. The load governor
# (`orpheus_synth::load`) predicts each piece from the costs below × the
# measured ratio and keeps the render under 55 % of real time (1,795 of
# 3,265 cycles a frame at 144 MHz): chorus off, then delay, reverb, then
# voices (released first, oldest first; the limit for new notes), never
# below 2; undone after 1 s (a voice) / 3 s (an effect) under 50 %. A
# piece is at most 4 ms (its frames from the prediction); the pace rule
# rests 4 ms before a piece that would end 8 ms after the last rest.
voices_max = 16
voices_min = 2
budget_pct = 55
restore_pct = 50
piece_us_max = 4000
# Cycles per frame on the player at 144 MHz, MEASURED 2026-11-26 by
# `synth bench` (build 1fda608d; no DWT on the chip: µs × 144; pager
# line loads included, as playback sees them): per voice = (load − empty)
# / voices; per effect = the effect's load with one sine voice − the same
# voice into the (compiled-out) delay, and with eight voices; the larger.
# 1.7–3.7 × the SYN-1/2 estimates (instructions + 1 per load/store),
# which did not count the code page cache's and SRAM's wait states: the
# measured ratio is ≈ 2.5 cycles per instruction at opt-level "s".
# `orpheus_synth::load::PLAYER` holds the table the governor uses.
cycles_empty_frame = 245
cycles_sine = 155
cycles_subtractive = 280          # presets 167–308, median 246; the table's value
cycles_saw_lead = 262
cycles_square_bass = 282
cycles_pwm_pad = 308
cycles_strings = 263
cycles_fm_2op = 288               # fm-bell 288, fm-bass 287
cycles_fm_4op = 453               # fm-epiano
cycles_kick = 296
cycles_snare = 388
cycles_closed_hat = 696
cycles_open_hat = 695
cycles_clap = 159
cycles_tom = 256
cycles_cymbal = 737
# Effects: the reverb 1,318 − 647 = 671 (one sine voice) / 2,996 − 2,344
# = 652 (eight saw voices); the chorus 764 − 647 = 117 / 2,905 − 2,711 =
# 194. (The first reading, 1,073 and 519, also counted the sine voice and
# its line loads.) The reverb is compute: +0.4 line loads a block over the
# dry load (≈ 40 cycles a frame); its 8-line network already runs at half
# rate; a step-by-step rewrite (bit-exact, 15 % faster on the host) has
# more instructions a frame on thumbv7em (≈ 313 against ≈ 255) and was
# not kept (04 §9).
cycles_reverb_frame = 671
cycles_chorus_frame = 194
# The delay is compiled out of the firmware (feature `delay` off: no MIDI
# controller feeds it; its code would not fit the code window). ESTIMATE:
# SYN-2's 90 × 2.3.
est_cycles_delay_frame = 210

[tts]
# Speech engine (04 §8, TTS-2, 2026-11-25). RAM: `Synth` (unit queue,
# synthesiser, resampler) measured 1,936 B on the host, `Speaker`
# (converter + synth) 3,352 B; `tests/speech.rs` asserts the plan's 8 KiB
# for the speaker and 6 KiB for the synth.
ram_bytes = 8192
# Word error rate (%) of an offline recogniser on the 24 sentences of
# `tests/intelligibility.rs` (runs when ORPHEUS_ASR_URL/ORPHEUS_ASR_CMD is
# set, "not run" otherwise). Measured with whisper.cpp 1.9.4, ggml-base.en,
# greedy: Neutral 13.9 / 30.5 / 93.0 % at 1x / 2x / 4x (run-to-run noise
# about +-2 points while tuning); Low 13.4 / 31.6, Bright 7.5 / 27.8 % at
# 1x / 2x. References on the same recogniser and sentences: espeak-ng
# 5.9 / 63 / 89 %, flite 7.5 % at 1x. Budgets = measured + margin. The 4x
# figure is the recogniser's limit, not the synthesiser's: our own 1x
# audio time-compressed 4x by WSOLA (sox tempo) scores 96 % (3x: 86 %,
# 2x: 41 %).
wer_max_pct_1x = 18
wer_max_pct_2x = 36
wer_max_pct_4x = 97
