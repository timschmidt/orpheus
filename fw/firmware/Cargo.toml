[package]
name = "firmware"
description = "orpheus firmware image for the Yoton YM03"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
atj2157-hal = { path = "../atj2157-hal", features = ["prof"] }
yoton-bsp = { path = "../yoton-bsp" }
orpheus-proto.workspace = true
orpheus-ui = { path = "../../crates/orpheus-ui" }
orpheus-apps = { path = "../../crates/orpheus-apps", features = ["games", "salvo", "bricks", "midi"] }
orpheus-tts = { path = "../../crates/orpheus-tts", optional = true }
orpheus-books = { path = "../../crates/orpheus-books" }
orpheus-input = { path = "../../crates/orpheus-input" }
orpheus-power = { path = "../../crates/orpheus-power" }
orpheus-settings = { path = "../../crates/orpheus-settings" }
orpheus-usb = { path = "../../crates/orpheus-usb" }
orpheus-pager = { path = "../../crates/orpheus-pager" }
orpheus-audio = { path = "../../crates/orpheus-audio" }
orpheus-codecs = { path = "../../crates/codecs" }
orpheus-dsp = { path = "../../crates/orpheus-dsp" }
orpheus-fs = { path = "../../crates/orpheus-fs" }
orpheus-player = { path = "../../crates/orpheus-player" }
orpheus-index = { path = "../../crates/orpheus-index" }
orpheus-library = { path = "../../crates/orpheus-library" }
orpheus-bt = { path = "../../crates/orpheus-bt" }
orpheus-fm = { path = "../../crates/orpheus-fm" }
orpheus-img = { path = "../../crates/orpheus-img" }
orpheus-meta = { path = "../../crates/orpheus-meta" }
orpheus-steps = { path = "../../crates/orpheus-steps" }
orpheus-hid = { path = "../../crates/orpheus-hid" }
orpheus-otp = { path = "../../crates/orpheus-otp" }
orpheus-update = { path = "../../crates/orpheus-update" }
orpheus-rec = { path = "../../crates/orpheus-rec" }
orpheus-synth = { path = "../../crates/orpheus-synth", default-features = false }
orpheus-midi = { path = "../../crates/orpheus-midi", default-features = false }
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-usb = { version = "0.6", default-features = false }
embassy-usb-driver = "0.2"
static_cell = "2"
critical-section = "1.2"

[features]
# The screen reader (A11Y-1) with its speech voice (TTS-3): `cargo xtask
# build --features speech`. Off by default: its code (≈ 76 KB paged, of
# which the speech engine ≈ 45 KB) does not fit the code window with
# everything else — 133 of 128 pages (STATUS 2026-11-27 "TTS-3"; an owner
# decision on what makes room).
speech = ["orpheus-ui/screen-reader", "orpheus-apps/screen-reader", "dep:orpheus-tts"]
# Books on the player (M15, 05 §7.15; the BOOK-1/2 wiring): the Books app,
# its card work in the card task (`src/books.rs`). Off: with it the paged
# code needs 139 of the code window's 128 pages and `.bss` grows 13,240 B
# (docs/STATUS.md); `cargo xtask build --features books` builds it.
books = ["orpheus-apps/books"]

[lints]
workspace = true
