[package]
name = "firmware"
description = "orpheus firmware image for the Yoton YM03"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
atj2157-hal = { path = "../atj2157-hal" }
yoton-bsp = { path = "../yoton-bsp" }
orpheus-proto.workspace = true
orpheus-ui = { path = "../../crates/orpheus-ui" }
orpheus-apps = { path = "../../crates/orpheus-apps" }
orpheus-input = { path = "../../crates/orpheus-input" }
orpheus-power = { path = "../../crates/orpheus-power" }
orpheus-settings = { path = "../../crates/orpheus-settings" }
orpheus-usb = { path = "../../crates/orpheus-usb" }
orpheus-pager = { path = "../../crates/orpheus-pager" }
orpheus-audio = { path = "../../crates/orpheus-audio" }
orpheus-codecs = { path = "../../crates/codecs" }
orpheus-dsp = { path = "../../crates/orpheus-dsp" }
orpheus-fs = { path = "../../crates/orpheus-fs" }
orpheus-player = { path = "../../crates/orpheus-player" }
orpheus-index = { path = "../../crates/orpheus-index" }
orpheus-library = { path = "../../crates/orpheus-library" }
orpheus-bt = { path = "../../crates/orpheus-bt" }
orpheus-fm = { path = "../../crates/orpheus-fm" }
orpheus-img = { path = "../../crates/orpheus-img" }
orpheus-meta = { path = "../../crates/orpheus-meta" }
orpheus-steps = { path = "../../crates/orpheus-steps" }
orpheus-hid = { path = "../../crates/orpheus-hid" }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-usb = { version = "0.6", default-features = false }
embassy-usb-driver = "0.2"
static_cell = "2"
critical-section = "1.2"

[lints]
workspace = true
