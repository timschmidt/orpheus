# Device workspace: crates that only build for the player
# (thumbv7em-none-eabihf, see .cargo/config.toml).
[workspace]
resolver = "3"
members = ["firmware", "atj2157-hal", "yoton-bsp", "bringup/*", "boot/stage2"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"

[workspace.dependencies]
yoton-proto = { path = "../crates/yoton-proto" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2
overflow-checks = false

[profile.release.package.stage2]
opt-level = "z"

[profile.dev]
panic = "abort"
opt-level = "s"
debug = 2
