[package]
name = "atj2157-hal"
description = "ATJ2157 drivers and Embassy glue: start-up, clocks, interrupts, critical section, time driver, watchdog, GPIO"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# WP-T-8: the PC sampler's vector and the pager fault log. Only the
# firmware enables it: small images (the ymon payloads) have no room for
# the profiler's code and state.
prof = []
# PG-2: cold code in the rodata window and the trampoline that runs an
# instruction whose constant shares its physical line (`pager`,
# `orpheus_pager::bounce`). Only the firmware enables it: without it such a
# fault is fatal, as before PG-2, and the payloads keep their room.
cold-code = []

[dependencies]
atj2157-pac = { path = "../../crates/atj2157-pac" }
orpheus-proto.workspace = true
orpheus-power = { path = "../../crates/orpheus-power" }
cortex-m = { version = "0.7", default-features = false, features = ["inline-asm"] }
critical-section = { version = "1.2", features = ["restore-state-u32"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3"
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-usb-driver = "0.2"
orpheus-pager = { path = "../../crates/orpheus-pager" }
orpheus-sdcard = { path = "../../crates/orpheus-sdcard" }

[lints]
workspace = true
