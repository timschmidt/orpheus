[package]
name = "bringup-i2c"
description = "FM-0 bring-up image: I2C bus scan, tuner and accelerometer ids (read-only)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
atj2157-hal = { path = "../../atj2157-hal" }
orpheus-proto.workspace = true
yoton-bsp = { path = "../../yoton-bsp" }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.5"
embassy-sync = "0.8"
static_cell = "2"

[lints]
workspace = true
