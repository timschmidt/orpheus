[package]
name = "bringup-charge"
description = "PWR-2 bring-up image: battery ADC, cable detect, charger state machine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
atj2157-hal = { path = "../../atj2157-hal" }
yoton-proto.workspace = true
yoton-bsp = { path = "../../yoton-bsp" }
yoton-power = { path = "../../../crates/yoton-power" }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.5"
embassy-sync = "0.8"
static_cell = "2"

[lints]
workspace = true
