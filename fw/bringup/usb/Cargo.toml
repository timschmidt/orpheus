[package]
name = "bringup-usb"
description = "USB-1 bring-up image: enumeration, developer channel over EP0"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
atj2157-hal = { path = "../../atj2157-hal" }
yoton-proto.workspace = true
yoton-bsp = { path = "../../yoton-bsp" }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.5"
embassy-sync = "0.8"
static_cell = "2"
embassy-usb = { version = "0.6", default-features = false }
embassy-futures = "0.1"
yoton-usb = { path = "../../../crates/yoton-usb" }

[lints]
workspace = true
