# Host workspace: everything that builds and tests on the desktop.
# Device-only crates (HAL, BSP, firmware, boot stages, bring-up images,
# payloads) live in the separate workspace under fw/, which builds for
# thumbv7em-none-eabihf. Shared no_std crates under crates/ are used by both.
[workspace]
resolver = "3"
members = ["crates/*", "crates/codecs/*", "sim", "sim/web", "xtask"]
exclude = ["fw"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/orpheus"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"

[workspace.dependencies]
orpheus-proto = { path = "crates/orpheus-proto" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2
overflow-checks = false

# The browser build (`cargo xtask wasm`, WEB-2): no debug info in the module.
[profile.web]
inherits = "release"
opt-level = 3
debug = 0

[profile.dev]
panic = "abort"
opt-level = 1

[profile.test]
opt-level = 1

# The speech engine at full optimisation in host builds (A11Y-1): the
# simulator renders the screen reader's speech in every journey with the
# reader on (the settings matrix runs hundreds): a 22 s journey took 7.8 s at
# opt-level 1, 0.04 s at 3.
[profile.dev.package.orpheus-tts]
opt-level = 3

[profile.test.package.orpheus-tts]
opt-level = 3

[profile.dev.package.orpheus-synth]
opt-level = 3

[profile.test.package.orpheus-synth]
opt-level = 3
