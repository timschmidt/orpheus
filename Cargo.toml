# Host workspace: everything that builds and tests on the desktop.
# Device-only crates (HAL, BSP, firmware, boot stages, bring-up images,
# payloads) live in the separate workspace under fw/, which builds for
# thumbv7em-none-eabihf. Shared no_std crates under crates/ are used by both.
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fw"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/yotonrs"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
yoton-proto = { path = "crates/yoton-proto" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2
overflow-checks = false

[profile.dev]
panic = "abort"
opt-level = 1

[profile.test]
opt-level = 1
