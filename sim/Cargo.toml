[package]
name = "orpheus-sim"
description = "Desktop simulator for the Orpheus UI: headless frame buffer, optional window, key scripts, golden images (07 §3.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# A 4x window (X11 via minifb, loaded at run time; builds without X headers).
window = ["dep:minifb"]

[dependencies]
orpheus-ui = { path = "../crates/orpheus-ui" }
orpheus-apps = { path = "../crates/orpheus-apps", features = ["games", "salvo", "bricks", "books"] }
orpheus-books = { path = "../crates/orpheus-books" }
orpheus-games = { path = "../crates/orpheus-games", features = ["salvo", "bricks"] }
orpheus-power = { path = "../crates/orpheus-power" }
orpheus-fm = { path = "../crates/orpheus-fm", features = ["fake"] }
orpheus-fs = { path = "../crates/orpheus-fs", features = ["std"] }
orpheus-meta = { path = "../crates/orpheus-meta" }
orpheus-audio = { path = "../crates/orpheus-audio" }
orpheus-img = { path = "../crates/orpheus-img" }
orpheus-index = { path = "../crates/orpheus-index" }
orpheus-library = { path = "../crates/orpheus-library" }
orpheus-steps = { path = "../crates/orpheus-steps" }
orpheus-otp = { path = "../crates/orpheus-otp" }
orpheus-hid = { path = "../crates/orpheus-hid" }
embassy-futures = "0.1"
orpheus-rec = { path = "../crates/orpheus-rec" }
orpheus-usb = { path = "../crates/orpheus-usb" }
orpheus-update = { path = "../crates/orpheus-update", features = ["std"] }
orpheus-proto = { path = "../crates/orpheus-proto" }
anyhow = "1"
minifb = { version = "0.29", optional = true, default-features = false, features = ["x11"] }

# PNG export and the card's PNG picture. Not in the browser build (WEB-2,
# `sim/web`): orpheus-host also carries the USB transport.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orpheus-host = { path = "../crates/orpheus-host" }

[lints]
workspace = true

[dev-dependencies]
# VER-13: the settings matrix reads tests/settings/effects.toml.
toml = "0.8"
orpheus-codec-flac = { path = "../crates/codecs/flac" }
orpheus-codec-wav = { path = "../crates/codecs/wav" }
