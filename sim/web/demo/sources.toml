# The demo card's third-party content (WEB-2, owner's request 2026-11-27):
# real, freely licensed works, pinned by reference. Nothing here is
# synthesised or machine-generated.
#
# `cargo xtask wasm --demo` downloads each `url` into
# `target/orpheus/demo-cache/` (generic User-Agent, one file at a time),
# checks its SHA-256 and derives every output marked `web = true` into
# `sim/web/demo/card/` (committed: the site build does not depend on the
# sources being up), plus `card/CREDITS.txt` and `CREDITS.md` from this
# file. `cargo xtask demo-card` builds the player's card tree in
# `target/orpheus/demo-card/`: the same files plus every `web = false`
# output (complete recordings, full-size pictures; no size budget there).
#
# Per work: what it is, who made it, the rights in the composition or text
# *and* in the recording, scan or file, the page the licence was checked on
# (2026-11-27), the exact file and its SHA-256. Per output: where it goes
# on the card, how it is made (`copy`, `ffmpeg` output options, or `lrc`
# from a subtitle file) and the changes in words (CC BY / BY-SA require a
# note of changes).
#
# `ffmpeg` runs as `ffmpeg -i SOURCE -map_metadata -1 [tags] OPTIONS OUT`
# (audio sources are mapped with `-map 0:a`, so embedded cover art is not
# carried over). Tags come from the work's `tags`, then the output's.

# ------------------------------------------------------------------ music

