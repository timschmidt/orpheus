<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Orpheus">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{base}}brand/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Orpheus lyre and the words: pure-Rust firmware for the Yoton YM03 player">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}brand/favicon.ico" sizes="48x48">
<link rel="icon" href="{{root}}brand/orpheus-lyre-small.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}brand/apple-touch-icon.png">
<link rel="manifest" href="{{root}}site.webmanifest">
<link rel="stylesheet" href="{{root}}style.css">
<script src="{{root}}theme.js"></script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site">
  <a class="brand" href="{{root}}index.html" aria-label="Orpheus home">
    <img src="{{root}}brand/orpheus-lyre-small.svg" alt="" width="32" height="32">
    <span class="wordmark">{{wordmark}}</span>
  </a>
  <nav aria-label="Main">
    <ul>
{{nav}}
    </ul>
  </nav>
  <button class="theme" type="button" aria-label="Colour theme: automatic" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2v16a8 8 0 0 1 0-16z"/></svg>
  </button>
</header>
<main id="main">
{{content}}
</main>
<footer class="site">
  <p>Orpheus is free software under MIT OR Apache-2.0. <a href="https://github.com/timschmidt/orpheus">Source</a> · <a href="{{source}}">This page's source</a> · No trackers, no external fonts.</p>
</footer>
</body>
</html>
